<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Linux Desktop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:manipulation}
body{background:#000 center/cover no-repeat;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif;color:#fff}
input,textarea,button{font-family:inherit}
#fileInput,#iconInput{display:none}
:root{--tb-bg:rgba(255,255,255,.2);--tbh:32px;--sp-a:.6}
.top-bar{position:fixed;top:0;left:0;width:100%;height:var(--tbh);background:var(--tb-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:10000;pointer-events:none}
.clock{margin-left:auto;flex:0 0 auto;height:var(--tbh);display:flex;align-items:center;padding-right:12px;font-size:13px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:pre;pointer-events:none}
.square-icon{position:fixed;top:0;left:8px;height:var(--tbh);width:var(--tbh);z-index:10002;cursor:pointer;display:flex;align-items:center;justify-content:center}
.square-icon img{width:75%;height:75%;object-fit:contain}
.taskbar{position:fixed;top:0;left:calc(var(--tbh) + 12px);right:0;height:var(--tbh);display:flex;align-items:center;gap:8px;z-index:10002;pointer-events:none}
.pinned-bar{flex:0 1 auto;min-width:0;height:var(--tbh);display:flex;align-items:center;gap:4px;overflow:auto hidden;scrollbar-width:none}
.pinned-bar::-webkit-scrollbar{display:none}
.pinned-item{pointer-events:auto;flex:0 0 auto;max-width:90px;padding:3px 8px;background:rgba(0,0,0,.28);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pinned-item.win-on{background:rgba(96,165,250,.5)}
.pinned-item.icon-only{height:var(--tbh);display:flex;align-items:center;padding:3px 6px;background:transparent}
.ws-div{flex:0 0 auto;width:1px;height:20px;background:#fff;opacity:.4}
.workspaces{display:flex;align-items:center}
.ws{pointer-events:auto;height:var(--tbh);width:26px;line-height:var(--tbh);text-align:center;font-size:13px;cursor:pointer;text-shadow:0 1px 3px #000}
.ws.active{color:#60a5fa;font-weight:700}
#winBar{flex:1 1 auto}

.dropdown{position:fixed;top:var(--tbh);left:0;background:rgba(30,30,30,.85);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);width:320px;max-width:100%;height:500px;max-height:calc(100% - var(--tbh) - 10px);display:none;flex-direction:column;z-index:10003;overflow:hidden;box-shadow:4px 4px 20px rgba(0,0,0,.5)}
.dropdown.show{display:flex;animation:fadeUp .18s ease-out}
.search-bar{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.search-bar input{width:100%;padding:8px 14px;background:rgba(255,255,255,.08);color:#fff;border:1px solid #3b82f6;outline:none;border-radius:16px;font-size:13px}
.body-area{display:flex;flex:1;min-height:0}
.col{width:50%;display:flex;flex-direction:column;min-width:0;position:relative}
.col+.col{background:rgba(0,0,0,.2)}
.list{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;padding-bottom:36px}
.ditem{padding:10px 12px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid rgba(255,255,255,.05)}
.ditem.active{background:rgba(255,255,255,.18)}
.addbtn{position:absolute;left:0;bottom:0;width:100%;padding:8px 10px;color:#60a5fa;font-size:11px;cursor:pointer;background:rgba(30,30,30,.5);border-top:1px solid rgba(255,255,255,.08)}
.sub-item{padding:8px 10px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;overflow:hidden}
.sub-item:active{background:rgba(255,255,255,.12)}
.sub-t{min-width:0;display:flex;flex-direction:column}
.sub-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-g{font-size:10px;color:rgba(255,255,255,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-icon{flex:0 0 auto;object-fit:cover}
.app-icon-letter{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);color:#fff;font-size:12px;font-weight:700}
.empty{padding:14px;color:rgba(255,255,255,.4);font-size:12px;text-align:center}
.bottom-bar{height:36px;background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center}
.bottom-bar img{margin-left:12px;height:20px;width:20px;object-fit:contain}
.bottom-bar b{margin-left:8px;font-size:13px;font-weight:500}
.settings-btn{margin-left:auto;margin-right:6px;height:36px;padding:0 10px;display:flex;align-items:center;font-size:13px;cursor:pointer}
.ctx-menu{position:fixed;background:rgba(35,35,40,.98);border:1px solid rgba(255,255,255,.15);z-index:45000;box-shadow:0 8px 24px rgba(0,0,0,.6);font-size:13px;min-width:150px;animation:fadeUp .15s ease-out}
.ctx-item{padding:9px 14px;cursor:pointer;white-space:nowrap}
.ctx-item:hover,.ctx-item:active{background:rgba(255,255,255,.12)}
.ctx-item.danger{color:#f87171}

/* WINDOWS */
.sp{position:fixed;background:rgba(28,28,30,var(--sp-a));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:8px;border:1px solid rgba(255,255,255,.28);box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:20000;display:none;flex-direction:column;overflow:hidden}
.sp.show{display:flex}
.sp.closing{animation:wClose .22s ease-in forwards;pointer-events:none}
.sp.a-open{animation:wOpen .26s cubic-bezier(.34,1.4,.64,1) both}
.sp.a-min{animation:wMin .23s ease-in both}
.sp.animsize{transition:left .28s cubic-bezier(.3,.9,.4,1),top .28s cubic-bezier(.3,.9,.4,1),width .28s cubic-bezier(.3,.9,.4,1),height .28s cubic-bezier(.3,.9,.4,1)}
@keyframes wOpen{0%{opacity:0;transform:scale(.82)}55%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
@keyframes wMin{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.5) translateY(40px)}}
@keyframes wClose{0%{opacity:1;transform:scale(1)}45%{opacity:1;transform:scale(.94)}100%{opacity:0;transform:scale(.82)}}
.sp.max{border:none;border-radius:0}
.sp-head{flex:0 0 auto;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 14px;touch-action:none;cursor:move;border-bottom:1px solid rgba(255,255,255,.1);font-size:14px;font-weight:600}
.sp.max .sp-head{cursor:default}
.sp-wbtns{display:flex;gap:2px}
.sp-wbtn{width:36px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.sp-wbtn:hover,.sp-wbtn:active{background:rgba(255,255,255,.2)}
.sp-x:hover,.sp-x:active{background:#e81123}
.sp-body{flex:1;display:flex;min-height:0;position:relative}
.sp-h{position:absolute;width:20px;height:20px;z-index:5;touch-action:none}
.sp.max .sp-h{display:none}
.sp-h[data-c=tl]{left:-6px;top:-6px;cursor:nwse-resize}.sp-h[data-c=tr]{right:-6px;top:-6px;cursor:nesw-resize}
.sp-h[data-c=bl]{left:-6px;bottom:-6px;cursor:nesw-resize}.sp-h[data-c=br]{right:-6px;bottom:-6px;cursor:nwse-resize}
.sp-h[data-c=t]{left:14px;right:14px;width:auto;height:12px;top:-6px;cursor:ns-resize}
.sp-h[data-c=b]{left:14px;right:14px;width:auto;height:12px;bottom:-6px;cursor:ns-resize}
.sp-h[data-c=l]{top:14px;bottom:14px;height:auto;width:12px;left:-6px;cursor:ew-resize}
.sp-h[data-c=r]{top:14px;bottom:14px;height:auto;width:12px;right:-6px;cursor:ew-resize}

.modal-bk{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:46000;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.modal{width:min(92%,380px);max-height:92%;display:flex;flex-direction:column;background:rgba(28,28,32,.98);border:1px solid rgba(255,255,255,.25);box-shadow:0 10px 30px rgba(0,0,0,.7)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.12);font-size:14px;font-weight:600}
.modal-x{cursor:pointer;padding:0 6px}
.modal-b{overflow-y:auto;padding:12px}
.dlg-msg{white-space:pre-wrap;font-size:13px;margin-bottom:12px;word-break:break-word}
.dlg-input{width:100%;padding:8px;background:#1e1e22;color:#fff;border:1px solid #3b82f6;outline:none;font-size:14px;margin-bottom:12px}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{padding:7px 12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:12px;cursor:pointer;border-radius:3px}
.btn:active{background:rgba(255,255,255,.25)}
.btn.on{background:#3b82f6;border-color:#3b82f6}.btn.danger{color:#f87171}
.set{padding:14px;overflow-y:auto;width:100%}
.set h3{font-size:16px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
.num{width:64px;padding:6px;background:#1e1e22;border:1px solid rgba(255,255,255,.2);color:#fff;text-align:right}
.prev{width:100%;max-width:260px;aspect-ratio:16/9;background:#000 center/cover;border:1px solid rgba(255,255,255,.2);margin-bottom:10px}
.note{font-size:11px;color:rgba(255,255,255,.55);margin-top:8px;min-height:14px}

.desktop{position:fixed;inset:0;z-index:10001;pointer-events:none}
.desk-item{position:absolute;touch-action:none;pointer-events:auto;display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:4px;cursor:pointer}
.desk-item:active{background:rgba(255,255,255,.15)}
.desk-name{font-size:12px;line-height:1.2;text-align:center;text-shadow:0 1px 3px #000;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}

/* FILE MANAGER (Thunar) */
.fm{display:flex;flex-direction:column;width:100%;height:100%;background:#2b2d33;color:#e5e5e5}
.fm-tb{display:flex;align-items:center;gap:4px;padding:6px 8px;background:#33363d;border-bottom:1px solid #1d1f24}
.fm-tb button{min-width:30px;height:28px;padding:0 8px;background:transparent;border:none;color:#ddd;cursor:pointer;border-radius:4px;font-size:13px;white-space:nowrap}
.fm-tb button:hover,.fm-tb button:active{background:rgba(255,255,255,.12)}
.fm-tb button:disabled{opacity:.3}
.fm-path{flex:1;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;padding:3px 8px;font-size:12px;white-space:nowrap;background:#24262b;border-radius:4px;margin:0 4px}
.fm-path::-webkit-scrollbar{display:none}
.crumb{padding:3px 5px;border-radius:4px;cursor:pointer;color:#aab}
.crumb:hover{background:rgba(255,255,255,.1)}.crumb.last{color:#fff;font-weight:600}
.fm-main{flex:1;display:flex;min-height:0}
.fm-side{flex:0 0 140px;background:#26282d;border-right:1px solid #1d1f24;overflow-y:auto;padding:6px 0;font-size:12px}
.fm-sitem{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;color:#ccc;white-space:nowrap}
.fm-sitem svg{width:16px;height:16px;flex:0 0 auto}
.fm-sitem:hover{background:rgba(255,255,255,.07)}.fm-sitem.active{background:rgba(59,130,246,.3);color:#fff}
.fm-grid{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));grid-auto-rows:min-content;gap:6px;align-content:start;background:#2b2d33}
.fm-it{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:6px;cursor:pointer;text-align:center;font-size:12px;word-break:break-all}
.fm-it:hover,.fm-it:active{background:rgba(59,130,246,.3)}
.fm-it svg{width:44px;height:44px}
.fm-it span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fm-empty{grid-column:1/-1;padding:20px;text-align:center;color:#777;font-size:12px}
.fm-st{padding:4px 12px;background:#33363d;border-top:1px solid #1d1f24;font-size:11px;color:#999;display:flex;justify-content:space-between}

/* TEXT EDITOR (Mousepad) */
.ed{position:relative;display:flex;flex-direction:column;width:100%;height:100%;background:#fafafa;color:#222}
.ed-menu{display:flex;background:#ececec;border-bottom:1px solid #cfcfcf;font-size:13px;flex:0 0 auto}
.ed-mi{padding:6px 12px;cursor:pointer;color:#222}
.ed-mi.open,.ed-mi:active{background:#cfd8e8}
.ed-dd{display:none;position:absolute;top:30px;background:#fff;border:1px solid #bbb;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:30;min-width:150px;color:#222;font-size:13px}
.ed-dd div{padding:8px 14px;cursor:pointer}.ed-dd div:hover,.ed-dd div:active{background:#dbe7fb}
.ed-tab{padding:4px 12px;font-size:12px;background:#f3f3f3;border-bottom:1px solid #ddd;color:#555;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed textarea{flex:1;width:100%;border:none;outline:none;resize:none;padding:8px;background:#fff;color:#111;font:13px/1.4 monospace;user-select:text;-webkit-user-select:text;white-space:pre-wrap}
.ed-st{display:flex;justify-content:space-between;padding:3px 10px;background:#ececec;border-top:1px solid #cfcfcf;font-size:11px;color:#555;flex:0 0 auto}

/* TERMINAL (Linux) */
.term{display:flex;flex-direction:column;width:100%;height:100%;background:#101420;font:13px/1.35 monospace;color:#e6e6e6;padding:8px}
.term-out{flex:1;overflow-y:auto;min-height:0;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text}
.term-out>div{min-height:1.35em}
.c1{color:#5b8def}.c2{color:#3b82f6;font-weight:700}.c3{color:#fff}.dir{color:#5b8def;font-weight:700}.ok{color:#4ade80}.er{color:#f87171}
.term-in{flex:0 0 auto;padding-top:4px}
.term-row{display:flex;align-items:center;gap:6px}
.term-row input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:#fff;font:13px monospace}

body[data-tb=bottom] .top-bar,body[data-tb=bottom] .square-icon,body[data-tb=bottom] .taskbar{top:auto;bottom:0}
body[data-tb=bottom] .dropdown{top:auto;bottom:var(--tbh)}
body[data-tb=left] .top-bar,body[data-tb=right] .top-bar{width:var(--tbh);height:100%}
body[data-tb=right] .top-bar{left:auto;right:0}
body[data-tb=left] .square-icon,body[data-tb=right] .square-icon{width:var(--tbh);height:40px;left:0}
body[data-tb=right] .square-icon{left:auto;right:0}
body[data-tb=left] .taskbar,body[data-tb=right] .taskbar{top:44px;bottom:0;left:0;right:auto;width:var(--tbh);height:auto;flex-direction:column;gap:8px}
body[data-tb=right] .taskbar{left:auto;right:0}
body[data-tb=left] .pinned-bar,body[data-tb=right] .pinned-bar{flex-direction:column;width:var(--tbh);height:auto;gap:6px;overflow:hidden auto}
body[data-tb=left] #winBar,body[data-tb=right] #winBar{flex:0 0 auto}
body[data-tb=left] .pinned-item,body[data-tb=right] .pinned-item{width:var(--tbh);max-width:var(--tbh);padding:3px 0;text-align:center;font-size:10px;text-overflow:clip}
body[data-tb=left] .ws-div,body[data-tb=right] .ws-div{width:20px;height:1px}
body[data-tb=left] .workspaces,body[data-tb=right] .workspaces{flex-direction:column}
body[data-tb=left] .clock,body[data-tb=right] .clock{display:none}
body[data-tb=left] .dropdown{top:0;left:var(--tbh)}
body[data-tb=right] .dropdown{top:0;left:auto;right:var(--tbh)}

@keyframes fadeUp{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes spIn{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
@keyframes spOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.88)}}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.25)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.bouncing{animation:bounce .4s}
#ui{position:fixed;left:0;top:0;transform-origin:0 0}
#videoBg{position:fixed;inset:0;z-index:0;object-fit:cover;display:none;background:#000}
#videoInput{display:none}
.clock,.pinned-item,.ws{color:var(--tb-color,#fff)}
.ws-div{background:var(--tb-color,#fff)}
@keyframes popItem{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
@keyframes selListIn{0%{opacity:0;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
.sp-nav{flex:0 0 120px;border-right:1px solid rgba(255,255,255,.1);overflow-y:auto;padding:6px 0}
.sp-nav-item{padding:11px 14px;font-size:13px;cursor:pointer;border-left:3px solid transparent;transition:background .18s,border-color .18s}
.sp-nav-item.active{background:rgba(255,255,255,.1);border-left-color:#60a5fa;animation:popItem .25s ease-out}
.sp-content{flex:1;min-width:0;overflow-y:auto;padding:14px}
.sp-page{display:none}.sp-page.active{display:block;animation:fadeUp .25s ease-out both}
.sp-title{font-size:16px;font-weight:600;margin-bottom:12px}
.sp-preview{width:100%;max-width:280px;aspect-ratio:16/9;background:#000 center/cover no-repeat;border:1px solid rgba(255,255,255,.2);margin-bottom:12px;display:flex;align-items:center;justify-content:center;color:#888;font-size:12px}
.sp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}
.sp-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sp-btn{padding:7px 12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:12px;font-family:inherit;cursor:pointer}
.sp-btn:active{background:rgba(255,255,255,.25)}
.sp-btn.danger{color:#f87171}.sp-btn.on{background:#3b82f6;border-color:#3b82f6}
.sp-note{font-size:11px;color:rgba(255,255,255,.5);margin-top:8px;min-height:14px}
.sp-num{width:64px;padding:6px;background:#1e1e1e;border:1px solid rgba(255,255,255,.2);color:#fff;text-align:right;font-size:12px}
.sp-swatch{width:44px;height:30px;border:1px solid #888;cursor:pointer}
.sp-sel{position:relative;min-width:120px;font-size:12px}
.sp-sel-cur{position:relative;padding:7px 26px 7px 10px;background:#1e1e1e;border:1px solid rgba(255,255,255,.2);cursor:pointer}
.sp-sel-cur::after{content:'▾';position:absolute;right:9px;top:7px}
.sp-sel-list{display:none;position:absolute;top:100%;left:0;right:0;background:#1e1e1e;border:1px solid rgba(255,255,255,.2);z-index:20;box-shadow:0 4px 10px rgba(0,0,0,.5)}
.sp-sel.open .sp-sel-list{display:block;animation:selListIn .18s ease-out both}
.sp-sel-list div{padding:8px 10px;cursor:pointer}.sp-sel-list div.active{background:rgba(255,255,255,.15)}
.log{white-space:pre-wrap;font:12px monospace;color:#a3e635;min-height:110px;margin-bottom:10px}
.pbar{height:8px;background:rgba(255,255,255,.15)}.pbar i{display:block;height:100%;width:0;background:#3b82f6;transition:width .5s}
.pkg-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px}
.cp{display:flex;flex-direction:column;gap:10px}
.cp-sv{position:relative;height:150px;touch-action:none;border:1px solid #666}
.cp-hue{position:relative;height:18px;touch-action:none;border:1px solid #666;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.cp-knob{position:absolute;width:16px;height:16px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 3px #000;pointer-events:none}
.cp-hue .cp-knob{top:50%}
.cp-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.cp-grid div{aspect-ratio:1;border:1px solid #555;cursor:pointer}
.cp-row{display:flex;gap:8px;align-items:center}
.cp-prev{width:40px;height:30px;border:1px solid #888}
.cp-row input{flex:1;padding:6px;background:#1e1e1e;border:1px solid #555;color:#fff;font:13px monospace}
/* app nền trong suốt mờ (trừ File Manager) */
.term{background:transparent}
.ed{background:transparent;color:#eee}
.ed-menu{background:rgba(0,0,0,.25);border-bottom-color:rgba(255,255,255,.12)}
.ed-mi{color:#eee}.ed-mi.open,.ed-mi:active{background:rgba(255,255,255,.18)}
.ed-dd{background:rgba(30,30,34,.97);border-color:rgba(255,255,255,.2);color:#eee}
.ed-dd div:hover,.ed-dd div:active{background:rgba(255,255,255,.15)}

<script>
(function(){
'use strict';
try{
const $=id=>document.getElementById(id);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const jget=(k,d)=>{try{const v=JSON.parse(ls.get(k));return v==null?d:v}catch(e){return d}};
const nget=(k,d)=>{const v=parseInt(ls.get(k),10);return isNaN(v)?d:v};
const ui=$('ui');

/* ===== SETTINGS STATE ===== */
const num=(k,d,a,b)=>{const v=parseInt(ls.get(k),10);return(v>=a&&v<=b)?v:d};
let tb='top';{const t0=ls.get('linuxweb_tb');if(['bottom','left','right'].includes(t0))tb=t0}
document.body.dataset.tb=tb;
let dpi=num('linuxweb_dpi',100,70,200);
let isStretch=ls.get('linuxweb_stretch')==='1';
let res=ls.get('linuxweb_res')||'auto';
if(!(res in {auto:1,'1280x720':1,'1600x900':1,'1920x1080':1,'2560x1440':1}))res='auto';
let hz=num('linuxweb_hz',0,0,240);
let tbColor=ls.get('linuxweb_tb_color')||'#ffffff',tbText=ls.get('linuxweb_tb_text')||'#ffffff';
if(!/^#[0-9a-f]{6}$/i.test(tbColor))tbColor='#ffffff';
if(!/^#[0-9a-f]{6}$/i.test(tbText))tbText='#ffffff';
let tbA=num('linuxweb_tb_a',20,0,100),tbh=num('linuxweb_tbh',32,24,64),icoSz=num('linuxweb_ico',48,32,96);
let spA=num('linuxweb_sp_a',60,0,100);
let clockSec=ls.get('linuxweb_clock_sec')!=='0';
let ws=parseInt(ls.get('linuxweb_ws_v1'),10);if(isNaN(ws)||ws<1||ws>4)ws=1;
const RES={auto:null,'1280x720':[1280,720],'1600x900':[1600,900],'1920x1080':[1920,1080],'2560x1440':[2560,1440]};
const RES_LABEL={auto:'Gốc của máy','1280x720':'1280×720 (HD)','1600x900':'1600×900','1920x1080':'1920×1080 (FHD)','2560x1440':'2560×1440 (QHD)'};
let view={vw:innerWidth,vh:innerHeight,sx:1,sy:1,ox:0,oy:0};
function applyTheme(){
  const r=parseInt(tbColor.slice(1,3),16),g=parseInt(tbColor.slice(3,5),16),b=parseInt(tbColor.slice(5,7),16),s=document.documentElement.style;
  s.setProperty('--tb-bg','rgba('+r+','+g+','+b+','+(tbA/100)+')');s.setProperty('--tb-color',tbText);s.setProperty('--tbh',tbh+'px');
}
function applyDpi(){
  const k=dpi/100,W=innerWidth,H=innerHeight,base=RES[res]||[W,H],w=base[0]/k,h=base[1]/k;
  let sx=W/w,sy=H/h,ox=0,oy=0;
  if(!isStretch&&RES[res]){const s=Math.min(sx,sy);sx=sy=s;ox=(W-w*s)/2;oy=(H-h*s)/2}
  view={vw:w,vh:h,sx,sy,ox,oy};
  ui.style.width=w+'px';ui.style.height=h+'px';ui.style.transform='translate('+ox+'px,'+oy+'px) scale('+sx+','+sy+')';
}
function applyOpacity(){document.documentElement.style.setProperty('--sp-a',String(spA/100))}
function applyHz(){if(hz&&window.AndroidApp&&typeof window.AndroidApp.setRefreshRate==='function'){try{window.AndroidApp.setRefreshRate(hz)}catch(e){}}}
function wa(){const W=view.vw,H=view.vh;return{l:tb==='left'?tbh:0,t:tb==='top'?tbh:0,r:tb==='right'?W-tbh:W,b:tb==='bottom'?H-tbh:H}}
applyTheme();applyDpi();

/* ===== MODALS ===== */
function openModal(title,body){
  const bk=E('div','modal-bk'),m=E('div','modal'),h=E('div','modal-h'),x=E('b','modal-x','✕'),bd=E('div','modal-b');
  h.appendChild(E('span','',title));h.appendChild(x);bd.appendChild(body);m.appendChild(h);m.appendChild(bd);bk.appendChild(m);ui.appendChild(bk);
  const close=()=>{if(bk.parentNode)bk.remove()};
  x.onclick=close;bk.addEventListener('pointerdown',e=>{if(e.target===bk)close()});
  return close;
}
function uiAlert(msg,title){
  const bd=E('div');bd.innerHTML='<div class="dlg-msg"></div><div class="btns"><button class="btn on">OK</button></div>';
  bd.querySelector('.dlg-msg').textContent=msg;const c=openModal(title||'Thông báo',bd);bd.querySelector('button').onclick=c;
}
function uiConfirm(msg,cb){
  const bd=E('div');bd.innerHTML='<div class="dlg-msg"></div><div class="btns"><button class="btn" data-k="no">Hủy</button><button class="btn danger" data-k="ok">Đồng ý</button></div>';
  bd.querySelector('.dlg-msg').textContent=msg;const c=openModal('Xác nhận',bd);
  bd.querySelector('[data-k=no]').onclick=c;bd.querySelector('[data-k=ok]').onclick=()=>{c();cb()};
}
function uiPrompt(title,def,cb){
  const bd=E('div');bd.innerHTML='<input class="dlg-input" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="btns"><button class="btn" data-k="no">Hủy</button><button class="btn on" data-k="ok">OK</button></div>';
  const inp=bd.querySelector('input');inp.value=def||'';const c=openModal(title,bd);
  const ok=()=>{const v=inp.value.trim();c();if(v)cb(v)};
  bd.querySelector('[data-k=ok]').onclick=ok;bd.querySelector('[data-k=no]').onclick=c;
  inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')ok()});
  setTimeout(()=>{try{inp.focus();inp.select()}catch(e){}},60);
}

/* ===== CONTEXT MENU / LONG PRESS ===== */
let ctxEl=null;
function closeCtx(){if(ctxEl){ctxEl.remove();ctxEl=null}}
function showCtx(x,y,items){
  closeCtx();const m=E('div','ctx-menu');
  items.forEach(it=>{const r=E('div','ctx-item'+(it.danger?' danger':''),it.label);r.addEventListener('click',e=>{e.stopPropagation();closeCtx();it.action()});m.appendChild(r)});
  ui.appendChild(m);ctxEl=m;
  const lx=(x-view.ox)/view.sx,ly=(y-view.oy)/view.sy;m.style.left=Math.max(0,Math.min(lx,view.vw-m.offsetWidth-4))+'px';m.style.top=Math.max(0,Math.min(ly,view.vh-m.offsetHeight-4))+'px';
}
document.addEventListener('click',closeCtx);
document.addEventListener('contextmenu',e=>{if(!e.target.closest('textarea,input'))e.preventDefault()});
function longPress(el,cb){
  let t=null,sx=0,sy=0,fired=false;const cancel=()=>{clearTimeout(t);t=null};
  el.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;fired=false;sx=e.clientX;sy=e.clientY;cancel();t=setTimeout(()=>{fired=true;cb(e.clientX,e.clientY)},500)});
  el.addEventListener('pointermove',e=>{if(t&&Math.hypot(e.clientX-sx,e.clientY-sy)>10)cancel()});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,cancel));
  el.addEventListener('click',e=>{if(fired){e.stopImmediatePropagation();e.preventDefault();fired=false}},true);
}
function ctxOn(el,cb){el.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();cb(e.clientX,e.clientY)});longPress(el,cb)}

/* ===== WINDOW MANAGER ===== */
let zTop=20000,cascade=0;const windows=[];
const WMW=300,WMH=220;
function renderWinBar(){
  const bar=$('winBar');bar.innerHTML='';let topZ=0;
  windows.forEach(w=>{if(w.ws===ws&&w.isOpen())topZ=Math.max(topZ,parseInt(w.el.style.zIndex)||0)});
  windows.forEach(w=>{
    if(w.ws!==ws)return;
    const on=w.isOpen()&&(parseInt(w.el.style.zIndex)||0)===topZ;
    const it=E('div','pinned-item'+(on?' win-on':''),w.title);
    it.addEventListener('click',e=>{e.stopPropagation();if(!w.isOpen())w.show();else if(on)w.min();else{w.front();renderWinBar()}});
    bar.appendChild(it);
  });
}
function createWindow(o){
  const w=E('div','sp');
  w.innerHTML='<div class="sp-head"><span class="sp-t"></span><div class="sp-wbtns"><div class="sp-wbtn" data-a="min">─</div><div class="sp-wbtn" data-a="max">☐</div><div class="sp-wbtn sp-x" data-a="close">✕</div></div></div><div class="sp-body"></div>'+['tl','tr','bl','br','t','b','l','r'].map(c=>'<div class="sp-h" data-c="'+c+'"></div>').join('');
  w.querySelector('.sp-t').textContent=o.title;
  w.querySelector('.sp-body').appendChild(o.body);
  ui.appendChild(w);
  const A=wa(),AW=A.r-A.l,AH=A.b-A.t,off=(cascade++%5)*26;
  const st={w:Math.min(AW,o.w||Math.round(Math.min(AW*.9,760))),h:Math.min(AH,o.h||Math.round(Math.min(AH*.85,520))),max:!!o.max};
  st.x=A.l+Math.round((AW-st.w)/2)+off-52;st.y=A.t+Math.round((AH-st.h)/2)+off-52;
  let saved=o.max?{x:st.x,y:st.y,w:st.w,h:st.h}:null,open=true,closed=false;
  const handle={el:w,title:o.title,ws:ws,isOpen:()=>open&&!closed,
    refresh:apply,front:()=>{zTop++;w.style.zIndex=zTop},
    close:doClose,min:doMin,
    show(){open=true;apply();handle.front();anim('a-open',270);renderWinBar()}};
  function clamp(){const a=wa();st.w=Math.max(WMW,Math.min(st.w,a.r-a.l));st.h=Math.max(WMH,Math.min(st.h,a.b-a.t));st.x=Math.max(a.l,Math.min(st.x,a.r-st.w));st.y=Math.max(a.t,Math.min(st.y,a.b-st.h))}
  function apply(){
    const a=wa(),s=w.style;
    if(st.max){s.left=a.l+'px';s.top=a.t+'px';s.width=(a.r-a.l)+'px';s.height=(a.b-a.t)+'px'}
    else{clamp();s.left=st.x+'px';s.top=st.y+'px';s.width=st.w+'px';s.height=st.h+'px'}
    w.classList.toggle('max',st.max);
    w.querySelector('[data-a=max]').textContent=st.max?'❐':'☐';
    w.classList.toggle('show',open&&!closed&&handle.ws===ws);
  }
  let busy=false;
  function anim(cls,ms){['a-open','a-min'].forEach(c=>w.classList.remove(c));void w.offsetWidth;w.classList.add(cls);setTimeout(()=>w.classList.remove(cls),ms)}
  function doMin(){if(busy||!open||closed)return;busy=true;w.classList.add('a-min');setTimeout(()=>{open=false;busy=false;apply();w.classList.remove('a-min');renderWinBar()},230)}
  function doClose(){
    if(closed)return;closed=true;
    w.classList.add('closing');
    const fin=()=>{try{w.remove()}catch(e){}const i=windows.indexOf(handle);if(i>=0)windows.splice(i,1);renderWinBar()};
    setTimeout(fin,200);
    if(o.onClose){try{o.onClose()}catch(e){}}
  }
  function toggleMax(){
    w.classList.add('animsize');
    if(st.max){if(saved){st.x=saved.x;st.y=saved.y;st.w=saved.w;st.h=saved.h}st.max=false}
    else{saved={x:st.x,y:st.y,w:st.w,h:st.h};st.max=true}
    apply();setTimeout(()=>w.classList.remove('animsize'),300);
  }
  w.querySelector('.sp-wbtns').addEventListener('pointerdown',e=>e.stopPropagation());
  w.querySelector('.sp-wbtns').addEventListener('click',e=>{
    e.stopPropagation();const b=e.target.closest('.sp-wbtn');if(!b)return;
    const a=b.dataset.a;if(a==='close')doClose();else if(a==='min')doMin();else if(a==='max')toggleMax();
  });
  const head=w.querySelector('.sp-head');let drag=null;
  head.addEventListener('pointerdown',e=>{
    if(st.max||e.target.closest('.sp-wbtns')||(e.button!==undefined&&e.button!==0))return;
    drag={sx:e.clientX,sy:e.clientY,ox:st.x,oy:st.y,id:e.pointerId};try{head.setPointerCapture(e.pointerId)}catch(er){}
  });
  head.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;st.x=drag.ox+(e.clientX-drag.sx)/view.sx;st.y=drag.oy+(e.clientY-drag.sy)/view.sy;apply()});
  const endDrag=()=>{drag=null};head.addEventListener('pointerup',endDrag);head.addEventListener('pointercancel',endDrag);
  head.addEventListener('dblclick',toggleMax);
  w.querySelectorAll('.sp-h').forEach(h=>{
    let rz=null;
    h.addEventListener('pointerdown',e=>{
      if(st.max||(e.button!==undefined&&e.button!==0))return;e.stopPropagation();handle.front();
      rz={c:h.dataset.c,sx:e.clientX,sy:e.clientY,x:st.x,y:st.y,w:st.w,h:st.h,id:e.pointerId};try{h.setPointerCapture(e.pointerId)}catch(er){}
    });
    h.addEventListener('pointermove',e=>{
      if(!rz||e.pointerId!==rz.id)return;
      const dx=(e.clientX-rz.sx)/view.sx,dy=(e.clientY-rz.sy)/view.sy,a=wa();let x=rz.x,y=rz.y,ww=rz.w,hh=rz.h;
      if(rz.c.includes('r'))ww=Math.min(Math.max(WMW,rz.w+dx),a.r-rz.x);
      if(rz.c.includes('l')){ww=Math.max(WMW,rz.w-dx);x=rz.x+rz.w-ww;if(x<a.l){x=a.l;ww=rz.x+rz.w-a.l}}
      if(rz.c.includes('b'))hh=Math.min(Math.max(WMH,rz.h+dy),a.b-rz.y);
      if(rz.c.includes('t')){hh=Math.max(WMH,rz.h-dy);y=rz.y+rz.h-hh;if(y<a.t){y=a.t;hh=rz.y+rz.h-a.t}}
      st.x=x;st.y=y;st.w=ww;st.h=hh;apply();
    });
    const end=()=>{rz=null};h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end);
  });
  w.addEventListener('pointerdown',()=>{handle.front();setTimeout(renderWinBar,0)});
  windows.push(handle);handle.front();apply();anim('a-open',270);renderWinBar();
  return handle;
}
function refreshWindows(){windows.forEach(w=>w.refresh())}

/* ===== FAKE FILESYSTEM ===== */
const D=(c)=>({type:'dir',children:c||{}}),F=(content)=>({type:'file',size:content.length,content});
const FS=D({
  home:D({linux:D({Desktop:D(),Documents:D({'notes.txt':F('Ghi chú của Linux\n')}),Downloads:D(),Pictures:D(),Music:D(),Videos:D(),
    '.bashrc':F('# ~/.bashrc\nexport PS1="┌──(\\u㉿\\h)-[\\w]\\n└─\\$ "\n'),'.zshrc':F('# ~/.zshrc\n'),'hello.txt':F('Xin chào từ Linux!\n')})}),
  root:D(),
  etc:D({passwd:F('root:x:0:0:root:/root:/usr/bin/zsh\nlinux:x:1000:1000:Linux,,,:/home/linux:/usr/bin/zsh\n'),hostname:F('linux\n'),
    'os-release':F('PRETTY_NAME="Linux Rolling"\nNAME="Linux"\nID=linux\nVERSION="2024.1"\n')}),
  usr:D({bin:D({bash:F('(binary)'),ls:F('(binary)'),cat:F('(binary)'),python3:F('(binary)'),nmap:F('(binary)'),msfconsole:F('(ruby script)')}),
    share:D({wordlists:D({'rockyou.txt':{type:'file',size:139921497,content:'(wordlist)'}})})}),
  opt:D({offsec:D(),vulnhub:D()}),tmp:D()
});
function norm(p,cwd,home){
  if(p==='~'||p.startsWith('~/'))p=home+p.slice(1);
  if(!p.startsWith('/'))p=cwd+'/'+p;
  const out=[];p.split('/').forEach(s=>{if(!s||s==='.')return;if(s==='..')out.pop();else out.push(s)});
  return '/'+out.join('/');
}
function resolve(path){let n=FS;for(const p of path.split('/').filter(Boolean)){if(!n.children||!n.children[p])return null;n=n.children[p]}return n}
const join=(b,n)=>b==='/'?'/'+n:b+'/'+n;
function saveFile(path,text){
  const parts=path.split('/').filter(Boolean);if(!parts.length)return false;let n=FS;
  for(let i=0;i<parts.length-1;i++){const c=n.children&&n.children[parts[i]];if(c&&c.type==='dir')n=c;else return false}
  const ex=n.children[parts[parts.length-1]];if(ex&&ex.type==='dir')return false;
  n.children[parts[parts.length-1]]=F(text);return true;
}

/* ===== FILE MANAGER ===== */
const SVG_DIR='<svg viewBox="0 0 48 48"><path d="M4 12a3 3 0 0 1 3-3h11l4 4h19a3 3 0 0 1 3 3v22a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#3b82c4"/><path d="M4 19h40v18a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z" fill="#5aa7ec"/></svg>';
const SVG_FILE='<svg viewBox="0 0 48 48"><path d="M10 4h20l10 10v28a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#e5e7eb"/><path d="M30 4v10h10z" fill="#9ca3af"/><path d="M14 24h20M14 30h20M14 36h14" stroke="#9ca3af" stroke-width="2"/></svg>';
function openFileManager(start){
  const b=E('div','fm');
  b.innerHTML='<div class="fm-tb"><button data-a="back">←</button><button data-a="fwd">→</button><button data-a="up">↑</button><button data-a="home">⌂</button><div class="fm-path"></div><button data-a="new">+ Thư mục</button></div><div class="fm-main"><div class="fm-side"></div><div class="fm-grid"></div></div><div class="fm-st"><span class="n"></span><span class="c"></span></div>';
  const pathEl=b.querySelector('.fm-path'),side=b.querySelector('.fm-side'),grid=b.querySelector('.fm-grid'),sn=b.querySelector('.n'),sc=b.querySelector('.c');
  let cwd=start||'/home/linux',hist=[cwd],hi=0;
  const places=[['Home','/home/linux'],['Desktop','/home/linux/Desktop'],['Documents','/home/linux/Documents'],['Downloads','/home/linux/Downloads'],['Pictures','/home/linux/Pictures'],['Music','/home/linux/Music'],['Videos','/home/linux/Videos'],['File System','/']];
  const fmtSize=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB';
  function paint(){
    b.querySelector('[data-a=back]').disabled=hi<=0;b.querySelector('[data-a=fwd]').disabled=hi>=hist.length-1;
    side.innerHTML='';places.forEach(([l,p])=>{const d=E('div','fm-sitem'+(p===cwd?' active':''));d.innerHTML=SVG_DIR;d.appendChild(E('span','',l));d.onclick=()=>go(p);side.appendChild(d)});
    pathEl.innerHTML='';const root=E('span','crumb','/');root.onclick=()=>go('/');pathEl.appendChild(root);
    let acc='';const parts=cwd.split('/').filter(Boolean);
    parts.forEach((p,i)=>{acc+='/'+p;pathEl.appendChild(E('span','',' › '));const c=E('span','crumb'+(i===parts.length-1?' last':''),p),t=acc;c.onclick=()=>go(t);pathEl.appendChild(c)});
    pathEl.scrollLeft=pathEl.scrollWidth;
    grid.innerHTML='';const node=resolve(cwd);
    if(!node||!node.children){grid.appendChild(E('div','fm-empty','Không truy cập được'));return}
    const ents=Object.entries(node.children).sort(([an,av],[bn,bv])=>av.type!==bv.type?(av.type==='dir'?-1:1):an.localeCompare(bn));
    if(!ents.length)grid.appendChild(E('div','fm-empty','Thư mục trống'));
    ents.forEach(([name,item])=>{
      const isDir=item.type==='dir',it=E('div','fm-it');it.innerHTML=isDir?SVG_DIR:SVG_FILE;it.appendChild(E('span','',name));
      const open=()=>{if(isDir)go(join(cwd,name));else openEditor(join(cwd,name),item.content||'')};
      it.addEventListener('click',open);
      ctxOn(it,(x,y)=>showCtx(x,y,[
        {label:'Mở',action:open},

const TOOLS=['dmitry','ike-scan','recon-ng','theharvester','maltego','nikto','lynis','openvas','burpsuite','sqlmap','wpscan','dirb','zaproxy','john','hashcat','hydra','crunch','aircrack-ng','wifite','kismet','reaver','ghidra','radare2','gdb','msfconsole','searchsploit','beef-xss','wireshark','ettercap','bettercap','weevely','evil-winrm','autopsy','binwalk','volatility','cutycapt','faraday','pipal','setoolkit','sqlitebrowser','bulk-extractor','sherlock'];
function openTerminal(root,initCmd){

  const updPs=()=>{ps1.innerHTML=promptHtml()};
  const html=h=>{const d=E('div');d.innerHTML=h;out.appendChild(d);out.scrollTop=out.scrollHeight};
  const print=t=>html(esc(t));
  const win=createWindow({title:root?'Root Terminal':'Terminal',body:b});
  b.addEventListener('click',()=>{if(!getSelection().toString())try{inp.focus()}catch(e){}});
  html('<span class="ok">Linux Rolling (giả lập)</span> — gõ <b>help</b> để xem lệnh.');
  updPs();
  function fakeNmap(a){
    const t=a.filter(x=>!x.startsWith('-'))[0]||'127.0.0.1';
    print('Starting Nmap 7.94SVN ( https://nmap.org ) at '+new Date().toISOString().slice(0,16).replace('T',' ')+' UTC\nNmap scan report for '+t+'\nHost is up (0.00042s latency).\nNot shown: 997 closed tcp ports (reset)\nPORT    STATE SERVICE\n22/tcp  open  ssh\n80/tcp  open  http\n443/tcp open  https\n\nNmap done: 1 IP address (1 host up) scanned in 0.12 seconds');
  }
  function run(line){
    let s=line.trim();if(!s)return;
    if(s.startsWith('sudo ')){s=s.slice(5).trim()}
    let redir=null;const m=s.match(/^(.*?)\s*>\s*(\S+)\s*$/);if(m){s=m[1];redir=m[2]}
    const a=s.split(/\s+/).map(x=>x.replace(/^["']|["']$/g,'')),c=a[0],args=a.slice(1);
    const P=p=>norm(p,cwd,home);
    switch(c){
      case 'help':print('Lệnh: help clear date whoami id hostname pwd cd ls cat echo mkdir touch rm uname uptime ifconfig ip ping nmap neofetch history exit\nCông cụ giả lập: '+TOOLS.slice(0,12).join(' ')+' ...');break;
      case 'clear':out.innerHTML='';break;
      case 'date':print(new Date().toString());break;
      case 'whoami':print(user);break;
      case 'id':print(root?'uid=0(root) gid=0(root) groups=0(root)':'uid=1000(linux) gid=1000(linux) groups=1000(linux),27(sudo)');break;
      case 'hostname':print('linux');break;
      case 'pwd':print(cwd);break;
      case 'cd':{const t=P(args[0]||'~'),n=resolve(t);if(!n)print('cd: '+args[0]+': No such file or directory');else if(n.type!=='dir')print('cd: '+args[0]+': Not a directory');else{cwd=t;updPs()}break}
      case 'ls':{
        const flags=args.filter(x=>x.startsWith('-')).join(''),tp=args.find(x=>!x.startsWith('-')),t=P(tp||'.'),n=resolve(t);
        if(!n){print("ls: cannot access '"+tp+"': No such file or directory");break}
        if(n.type==='file'){print(tp);break}
        let names=Object.keys(n.children).sort();if(!flags.includes('a'))names=names.filter(x=>!x.startsWith('.'));
        else names=['.','..'].concat(names);
        const cell=x=>{const it=n.children[x];return(!it||it.type==='dir')?'<span class="dir">'+esc(x)+'</span>':esc(x)};
        if(flags.includes('l')){
          html('total '+names.length*4);
          names.forEach(x=>{const it=n.children[x],d=!it||it.type==='dir';html((d?'drwxr-xr-x':'-rw-r--r--')+' 1 '+user+' '+user+' '+String(d?4096:it.size).padStart(8)+' Jan  1 12:00 '+cell(x))});
        }else if(names.length)html(names.map(cell).join('  '));
        break}
      case 'cat':{if(!args.length){print('cat: missing file operand');break}args.forEach(f=>{const n=resolve(P(f));if(!n)print('cat: '+f+': No such file or directory');else if(n.type==='dir')print('cat: '+f+': Is a directory');else print((n.content||'').replace(/\n$/,''))});break}
      case 'echo':{const t=args.join(' ');if(redir){if(!saveFile(P(redir),t+'\n'))print('bash: '+redir+': cannot write')}else print(t);redir=null;break}
      case 'mkdir':args.forEach(f=>{const t=P(f),par=resolve(t.replace(/\/[^/]+$/,'')||'/'),nm=t.split('/').pop();if(!par||!par.children)print("mkdir: cannot create directory '"+f+"'");else if(par.children[nm])print("mkdir: cannot create directory '"+f+"': File exists");else par.children[nm]=D()});break;
      case 'touch':args.forEach(f=>{if(!resolve(P(f)))saveFile(P(f),'')});break;
      case 'rm':{args.filter(x=>!x.startsWith('-')).forEach(f=>{const t=P(f),par=resolve(t.replace(/\/[^/]+$/,'')||'/'),nm=t.split('/').pop();if(!par||!par.children||!par.children[nm])print("rm: cannot remove '"+f+"': No such file or directory");else if(par.children[nm].type==='dir'&&!args.some(x=>/^-.*r/.test(x)))print("rm: cannot remove '"+f+"': Is a directory");else delete par.children[nm]});break}
      case 'uname':print(args.includes('-a')?'Linux linux 6.6.9-amd64 #1 SMP PREEMPT_DYNAMIC x86_64 GNU/Linux':'Linux');break;
      case 'uptime':print(' '+new Date().toTimeString().slice(0,8)+' up '+Math.max(1,Math.round(performance.now()/60000))+' min,  1 user,  load average: 0.08, 0.03, 0.01');break;
      case 'ifconfig':case 'ip':print('eth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>  mtu 1500\n        inet 192.168.1.100  netmask 255.255.255.0  broadcast 192.168.1.255\n        ether 08:00:27:ab:cd:ef  txqueuelen 1000  (Ethernet)\n\nlo: flags=73<UP,LOOPBACK,RUNNING>  mtu 65536\n        inet 127.0.0.1  netmask 255.0.0.0');break;
      case 'ping':{const t=args.find(x=>!x.startsWith('-'))||'127.0.0.1';print('PING '+t+' ('+t+') 56(84) bytes of data.');for(let i=1;i<=3;i++)print('64 bytes from '+t+': icmp_seq='+i+' ttl=64 time='+(0.3+Math.random()*.5).toFixed(2)+' ms');print('\n--- '+t+' ping statistics ---\n3 packets transmitted, 3 received, 0% packet loss');break}
      case 'nmap':fakeNmap(args);break;
      case 'neofetch':html('<span class="c2">linux</span>@<span class="c2">linux</span>\n<span class="c1">OS:</span> Linux Rolling\n<span class="c1">Kernel:</span> 6.6.9-amd64\n<span class="c1">Shell:</span> zsh\n<span class="c1">Resolution:</span> '+innerWidth+'x'+innerHeight);break;
      case 'history':hist.forEach((h,i)=>print(String(i+1).padStart(4)+'  '+h));break;
      case 'su':case 'bash':case 'zsh':case 'sh':break;
      case 'exit':win.close();break;
      default:
        if(TOOLS.includes(c))print(c+' (giả lập)\nUsage: '+c+' [options] <target>\nĐây chỉ là bản demo, công cụ thật không chạy trong app này.');
        else html('<span class="er">zsh: command not found: '+esc(c)+'</span>');
    }
    if(redir&&c!=='echo'){}
  }
  function exec(line){
    html(promptHtml()+'\n<span class="c1">└─'+sym+'</span> '+esc(line));
    if(line.trim()){hist.push(line);hp=hist.length}
    run(line);updPs();out.scrollTop=out.scrollHeight;
  }
  inp.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Enter'){const v=inp.value;inp.value='';exec(v)}
    else if(e.key==='ArrowUp'){e.preventDefault();if(hp>0){hp--;inp.value=hist[hp]}}
    else if(e.key==='ArrowDown'){e.preventDefault();if(hp<hist.length-1){hp++;inp.value=hist[hp]}else{hp=hist.length;inp.value=''}}
  });
  if(initCmd)exec(initCmd);
  setTimeout(()=>{try{inp.focus()}catch(e){}},80);
}

/* ===== REAL SHELL (thay thế bản giả lập) ===== */
const SH=window.Shell&&typeof window.Shell.start==='function'?window.Shell:null;
const HOME=SH?String(SH.home()):'/';
const shQ=s=>"'"+String(s).replace(/'/g,"'\\''")+"'";
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const clean=t=>t.replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]/g,'').replace(/\r/g,'');
const jobs={};let jid=0;
window.__sh=function(id,d,done,code){
  const j=jobs[id];if(!j)return;
  if(d){const bin=atob(d),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);j.onData(j.dec.decode(u,{stream:true}))}
  if(done){delete jobs[id];j.onEnd(code)}
};
function sh(cmd,cwd,onData,onEnd){const id='j'+(++jid);jobs[id]={dec:new TextDecoder(),onData:onData||(()=>{}),onEnd:onEnd||(()=>{})};SH.start(id,cmd,cwd||HOME);return id}
const shRun=(cmd,cwd)=>new Promise(r=>{if(!SH)return r({out:'',code:-1});let o='';sh(cmd,cwd,t=>{o+=t},c=>r({out:o,code:c}))});
const NOSH='Không có cầu nối Shell. Cần chạy trong app Android đã thêm ShellBridge.';
async function readFile(p){return shRun('s=$(wc -c < '+shQ(p)+'); if [ "${s:-0}" -gt 1048576 ]; then echo __BIG__; exit 2; fi; cat '+shQ(p))}
async function writeFile(p,text){
  const data=b64(text),tmp=p+'.b64tmp';let r=await shRun(': > '+shQ(tmp));if(r.code)return false;
  for(let i=0;i<data.length;i+=50000){r=await shRun('printf %s '+shQ(data.slice(i,i+50000))+' >> '+shQ(tmp));if(r.code)return false}
  r=await shRun('base64 -d < '+shQ(tmp)+' > '+shQ(p)+'; c=$?; rm -f '+shQ(tmp)+'; exit $c');return r.code===0;
}

/* ---- Terminal thật ---- */
openTerminal=function(root,initCmd){
  const b=E('div','term');
  b.innerHTML='<div class="term-out"></div><div class="term-in"><div class="ps1 c2"></div><div class="term-row"><span class="c1">❯</span><input type="text" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"><button class="btn" data-k="c">^C</button></div></div>';
  const out=b.querySelector('.term-out'),inp=b.querySelector('input'),ps1=b.querySelector('.ps1');
  let cwd=HOME,cur=null;const hist=[];let hp=0;
  const user=root?'root':'shell',sym=root?'#':'$';
  const win=createWindow({title:root?'Root Terminal':'Terminal',body:b});
  const put=(t,c)=>{const d=E('div',c||'',t);out.appendChild(d);out.scrollTop=out.scrollHeight;return d};
  const updPs=()=>{ps1.textContent=user+'@android:'+(cwd===HOME?'~':cwd)+sym};
  updPs();
  b.addEventListener('click',()=>{if(!getSelection().toString())try{inp.focus()}catch(e){}});
  b.querySelector('[data-k=c]').onclick=e=>{e.stopPropagation();if(cur&&SH)SH.kill(cur)};
  if(!SH){put(NOSH,'er');inp.disabled=true;return}
  const M='__SHCWD__';
  function run(line){
    put(ps1.textContent+' '+line,'c2');const s=line.trim();if(!s)return;
    hist.push(line);hp=hist.length;
    if(s==='clear'){out.innerHTML='';return}
    if(s==='exit'){win.close();return}
    if(cur){put('Đang có lệnh chạy. Bấm ^C để dừng.','er');return}
    let script='export HOME='+shQ(HOME)+' TERM=dumb\ncd '+shQ(cwd)+' 2>/dev/null\n'+line+'\n__c=$?\nprintf "\\n'+M+'%s\\n" "$(pwd)"\nexit $__c';
    const cmd=root?"su -c 'eval \"$(printf %s "+b64(script)+" | base64 -d)\"'":script;
    let acc='',shown=0;const live=put('');
    const flush=fin=>{const i=acc.indexOf('\n'+M);const end=i>=0?i:(fin?acc.length:Math.max(shown,acc.length-M.length-1));if(end>shown){live.textContent+=clean(acc.slice(shown,end));shown=end;out.scrollTop=out.scrollHeight}};
    cur=sh(cmd,cwd,t=>{acc+=t;flush(false)},code=>{
      flush(true);const i=acc.indexOf('\n'+M);
      if(i>=0){const p=acc.slice(i+1+M.length).split('\n')[0].trim();if(p)cwd=p}
      if(!live.textContent)live.remove();
      if(code)put('[exit '+code+']','er');
      cur=null;updPs();out.scrollTop=out.scrollHeight;
    });
  }
  inp.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Enter'){const v=inp.value;inp.value='';run(v)}
    else if(e.key==='ArrowUp'){e.preventDefault();if(hp>0){hp--;inp.value=hist[hp]}}
    else if(e.key==='ArrowDown'){e.preventDefault();if(hp<hist.length-1){hp++;inp.value=hist[hp]}else{hp=hist.length;inp.value=''}}
  });
  const start=()=>{if(initCmd)run(initCmd)};
  if(root)shRun("su -c id").then(r=>{if(r.code){put('Thiết bị chưa root (lệnh su không chạy được).','er');inp.disabled=true}else{put(clean(r.out).trim(),'ok');start()}});
  else shRun('uname -a; id').then(r=>{put(clean(r.out).trim(),'ok');start()});
  setTimeout(()=>{try{inp.focus()}catch(e){}},80);
};

  renderWs();applyBackground();renderDesk();refreshWindows();renderWinBar();
  const c=$('desktop'),from=right?-view.vw:view.vw;
  c.style.transition='none';c.style.transform='translateX('+from+'px)';c.style.opacity='0';void c.offsetWidth;
  c.style.transition='transform .32s cubic-bezier(.3,.9,.4,1),opacity .32s ease';c.style.transform='translateX(0)';c.style.opacity='1';
}));
fileInput.addEventListener('change',ev=>{
  const file=ev.target.files&&ev.target.files[0];fileInput.value='';
  if(!file||!file.type.startsWith('image/'))return;
  const key=bgKey(),reader=new FileReader();
  reader.onload=e=>shrinkImage(e.target.result,1920,.85,url=>{saveBg(key,url);applyBackground()});
  reader.readAsDataURL(file);
});
videoInput.addEventListener('change',ev=>{
  const file=ev.target.files&&ev.target.files[0];videoInput.value='';
  if(!file||!file.type.startsWith('video/'))return;
  const reader=new FileReader();
  reader.onload=e=>{const ok=saveVid(vidKey(),e.target.result);applyBackground();if(!ok)uiAlert('Video quá lớn nên không lưu được vĩnh viễn. Video chỉ dùng tạm đến khi đóng app. Hãy chọn video nhỏ hơn (vài MB).')};
  reader.readAsDataURL(file);
});

/* ===== CLOCK ===== */
const clock=$('clock');
function updateClock(){const n=new Date(),p=v=>String(v).padStart(2,'0');clock.textContent=p(n.getHours())+':'+p(n.getMinutes())+(clockSec?':'+p(n.getSeconds()):'')+'  '+p(n.getDate())+'/'+p(n.getMonth()+1)+'/'+n.getFullYear()}
updateClock();setInterval(updateClock,1000);

/* ===== SETTINGS ===== */

    '</div>' +
    '<div class="sp-content">' +
      '<div class="sp-page active" id="sp-wp">' +

        '<div class="sp-row"><span>Logo thanh trên</span><div class="sp-btns"><button class="sp-btn" id="spTestPick">Đổi ảnh</button><button class="sp-btn" id="spTestReset">Khôi phục</button></div></div>' +

        '<div class="sp-row"><span>Màu nền Taskbar</span><div class="sp-swatch" id="spTbColor"></div></div>' +
        '<div class="sp-row"><span>Màu chữ Taskbar</span><div class="sp-swatch" id="spTbText"></div></div>' +
        '<div class="sp-row"><span>Độ mờ Taskbar (%)</span><input type="number" class="sp-num" id="spTbA" min="0" max="100" step="5"></div>' +
        '<div class="sp-row"><span>Kích thước biểu tượng (px)</span><input type="number" class="sp-num" id="spIco" min="32" max="96" step="4"></div>' +
        '<div class="sp-row"><span>Độ mờ cửa sổ (%)</span><input type="number" class="sp-num" id="spOpNum" min="0" max="100" step="5"></div>' +
      '</div>' +
      '<div class="sp-page" id="sp-disp">' +
        '<div class="sp-title">Màn hình</div>' +
        '<div class="sp-row"><span>Độ phân giải</span><div class="sp-sel" id="spRes"><div class="sp-sel-cur"></div><div class="sp-sel-list"></div></div></div>' +
        '<div class="sp-row"><span>Kéo dãn lấp đầy màn hình</span><button class="sp-btn" id="spStretchBtn">Tắt</button></div>' +
        '<div class="sp-row"><span>DPI / Tỉ lệ (%)</span><input type="number" class="sp-num" id="spDpiNum" min="70" max="200" step="10"></div>' +
        '<div class="sp-row"><span>Tần số quét (Hz)</span><div class="sp-sel" id="spHz"><div class="sp-sel-cur"></div><div class="sp-sel-list"></div></div></div>' +
      '</div>' +
      '<div class="sp-page" id="sp-sys">' +
        '<div class="sp-title">Hệ thống</div>' +
        '<div class="sp-row"><span>Cập nhật hệ thống</span><button class="sp-btn" id="spUpdate">Update System</button></div>' +
        '<div class="sp-row"><span>Quản lý gói</span><button class="sp-btn" id="spPkg">pacman</button></div>' +
        '<div class="sp-row"><span>Terminal</span><button class="sp-btn" id="spTerm">Open Terminal</button></div>' +
        '<div class="sp-row"><span>Cài đặt Android thật</span><button class="sp-btn" id="spAndroid">Mở</button></div>' +
      '</div>' +
    '</div>';

  createWindow({ title: 'Cài đặt', body: b, max: true });

  const spNote = b.querySelector('#spNote'), spClockSec = b.querySelector('#spClockSec');
  function spMsg(m) { spNote.textContent = m; }
  function bindSel(el, labels, get, set) {
    const cur = el.querySelector('.sp-sel-cur'), list = el.querySelector('.sp-sel-list'); list.innerHTML = '';
    const render = () => { const val = get(); cur.textContent = labels[val] || ''; list.querySelectorAll('div').forEach((o) => o.classList.toggle('active', o.dataset.v === String(val))) };
    Object.keys(labels).forEach((k) => { const d = document.createElement('div'); d.dataset.v = k; d.textContent = labels[k]; d.onclick = (e) => { e.stopPropagation(); el.classList.remove('open'); set(k); render() }; list.appendChild(d) });
    cur.onclick = (e) => { e.stopPropagation(); document.querySelectorAll('.sp-sel.open').forEach((x) => { if (x !== el) x.classList.remove('open') }); el.classList.toggle('open') };
    render(); return render;
  }

  b.addEventListener('click', () => document.querySelectorAll('.sp-sel.open').forEach((x) => x.classList.remove('open')));
  bindSel(b.querySelector('#spFit'), { cover: 'Lấp đầy', contain: 'Vừa khung', stretch: 'Kéo giãn' }, getFit, (k) => { ls.set('linuxweb_bg_fit', k); applyBackground() });
  bindSel(b.querySelector('#spTbSel'), { top: 'Trên', bottom: 'Dưới', left: 'Trái', right: 'Phải' }, () => tb, (k) => {
    tb = k; ls.set('linuxweb_tb', tb);
    document.body.dataset.tb = tb; updateClock(); renderDesk(); refreshWindows();
  });
  bindSel(b.querySelector('#spRes'), RES_LABEL, () => res, (k) => { res = k; ls.set('linuxweb_res', res); applyDpi(); renderDesk(); refreshWindows(); });
  bindSel(b.querySelector('#spHz'), { 0: 'Mặc định', 60: '60 Hz', 90: '90 Hz', 120: '120 Hz', 144: '144 Hz' }, () => hz, (k) => { hz = parseInt(k, 10); ls.set('linuxweb_hz', String(hz)); applyHz() });

  const renderClockSec = () => { spClockSec.textContent = clockSec ? 'Bật' : 'Tắt' };

  b.querySelector('#spPick').addEventListener('click', () => { spMsg(''); fileInput.click() });
  b.querySelector('#spVideoPick').addEventListener('click', () => { spMsg(''); videoInput.click() });
  b.querySelector('#spClear').addEventListener('click', () => {
    const k = bgKey(), v = vidKey(); delete bgMem[k]; ls.del(k); delete vidMem[v]; ls.del(v);
    applyBackground();
    spMsg('Đã xóa hình nền màn hình ' + ws + '.');
  });
  b.querySelector('#spAll').addEventListener('click', () => {
    const img = getBg(bgKey()), vid = getVid(vidKey());
    if (!img && !vid) { spMsg('Màn hình này chưa có hình nền.'); return }
    for (let i = 1; i <= 4; i++) { if (img) saveBg(bgKeyOf(i), img); if (vid) saveVid(vidKeyOf(i), vid) }
    applyBackground();
    spMsg('Đã áp dụng cho cả 4 màn hình.');
  });
  b.querySelector('#spTestPick').addEventListener('click', () => pickIcon({ type: 'test' }));
  b.querySelector('#spTestReset').addEventListener('click', () => resetIcon({ type: 'test' }));
  b.querySelector('#spLogoPick').addEventListener('click', () => pickIcon({ type: 'logo' }));
  b.querySelector('#spLogoReset').addEventListener('click', () => resetIcon({ type: 'logo' }));
  spClockSec.addEventListener('click', () => { clockSec = !clockSec; ls.set('linuxweb_clock_sec', clockSec ? '1' : '0'); renderClockSec(); updateClock() });
  b.querySelectorAll('.sp-nav-item').forEach((it) => it.addEventListener('click', () => {
    b.querySelectorAll('.sp-nav-item').forEach((x) => x.classList.toggle('active', x.dataset.page === it.dataset.page));
    b.querySelectorAll('.sp-page').forEach((p) => p.classList.toggle('active', p.id === 'sp-' + it.dataset.page));
  }));

  function bindNum(id, get, min, max, apply) {
    const el = b.querySelector('#' + id); el.value = get();
    el.addEventListener('keydown', (e) => e.stopPropagation());
    el.addEventListener('change', () => { let v = parseInt(el.value, 10); if (isNaN(v)) v = get(); v = Math.max(min, Math.min(max, v)); el.value = v; apply(v) });
  }
  bindNum('spTbA', () => tbA, 0, 100, (v) => { tbA = v; ls.set('linuxweb_tb_a', String(v)); applyTheme() });
  bindNum('spIco', () => icoSz, 32, 96, (v) => { icoSz = v; ls.set('linuxweb_ico', String(v)); renderDesk() });
  bindNum('spOpNum', () => spA, 0, 100, (v) => { spA = v; ls.set('linuxweb_sp_a', String(v)); applyOpacity() });
  bindNum('spDpiNum', () => dpi, 70, 200, (v) => { dpi = v; ls.set('linuxweb_dpi', String(v)); applyDpi(); renderDesk(); refreshWindows(); });
  const spStretchBtn = b.querySelector('#spStretchBtn');
  function renderStretchBtn() { spStretchBtn.textContent = isStretch ? 'Bật' : 'Tắt'; spStretchBtn.classList.toggle('on', isStretch) }
  spStretchBtn.addEventListener('click', () => { isStretch = !isStretch; ls.set('linuxweb_stretch', isStretch ? '1' : '0'); renderStretchBtn(); applyDpi(); renderDesk(); refreshWindows(); });

  const SWATCHES = ['#ffffff', '#d1d5db', '#6b7280', '#000000', '#ef4444', '#f97316', '#eab308', '#22c55e', '#14b8a6', '#3b82f6', '#6366f1', '#a855f7', '#ec4899', '#f43f5e', '#84cc16', '#06b6d4', '#1e293b', '#7f1d1d', '#14532d', '#1e3a8a', '#581c87', '#831843', '#78350f', '#0f172a'];
  function openColorPicker(title, initial, onPick) {
    let [h, s, v] = hex2hsv(/^#[0-9a-f]{6}$/i.test(initial) ? initial : '#ffffff');
    const bd = document.createElement('div'); bd.className = 'cp';
    bd.innerHTML = '<div class="cp-sv"><i class="cp-knob"></i></div><div class="cp-hue"><i class="cp-knob"></i></div><div class="cp-grid"></div><div class="cp-row"><div class="cp-prev"></div><input type="text" maxlength="7"></div>';
    const sv = bd.querySelector('.cp-sv'), hue = bd.querySelector('.cp-hue'), grid = bd.querySelector('.cp-grid'), prev = bd.querySelector('.cp-prev'), inp = bd.querySelector('input');
    function upd(skipInput) {
      const hex = hsv2hex(h, s, v);
      sv.style.background = 'linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(' + h + ',100%,50%))';
      const k = sv.firstChild; k.style.left = (s * 100) + '%'; k.style.top = ((1 - v) * 100) + '%'; hue.firstChild.style.left = (h / 360 * 100) + '%';
      prev.style.background = hex; if (!skipInput) inp.value = hex; onPick(hex);
    }
    function drag(el, fn) {
      const mv = (e) => { const r = el.getBoundingClientRect(); fn(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))); upd() };
      el.addEventListener('pointerdown', (e) => { e.preventDefault(); try { el.setPointerCapture(e.pointerId) } catch (er) { } el._d = true; mv(e) });
      el.addEventListener('pointermove', (e) => { if (el._d) mv(e) });
      ['pointerup', 'pointercancel'].forEach((ev) => el.addEventListener(ev, () => { el._d = false }));
    }
    drag(sv, (x, y) => { s = x; v = 1 - y }); drag(hue, (x) => { h = Math.min(359.9, x * 360) });
    SWATCHES.forEach((c) => { const d = document.createElement('div'); d.style.background = c; d.onclick = () => {[h, s, v] = hex2hsv(c); upd() }; grid.appendChild(d) });
    inp.addEventListener('keydown', (e) => e.stopPropagation());
    inp.addEventListener('input', () => { let t = inp.value.trim(); if (t[0] !== '#') t = '#' + t; if (/^#[0-9a-f]{6}$/i.test(t)) {[h, s, v] = hex2hsv(t); upd(true) } });
    openModal(title, bd); upd();
  }
  function hsv2hex(h, s, v) { const f = (n) => { const k = (n + h / 60) % 6; return Math.round((v - v * s * Math.max(0, Math.min(k, 4 - k, 1))) * 255).toString(16).padStart(2, '0') }; return '#' + f(5) + f(3) + f(1) }
  function hex2hsv(x) {
    if (!/^#[0-9a-f]{6}$/i.test(x)) x = '#ffffff';
    const r = parseInt(x.slice(1, 3), 16) / 255, g = parseInt(x.slice(3, 5), 16) / 255, bl = parseInt(x.slice(5, 7), 16) / 255, mx = Math.max(r, g, bl), d = mx - Math.min(r, g, bl); let h = 0;
    if (d) { if (mx === r) h = ((g - bl) / d + 6) % 6; else if (mx === g) h = (bl - r) / d + 2; else h = (r - g) / d + 4; h *= 60 }
    return [h, mx ? d / mx : 0, mx];
  }
  b.querySelector('#spTbColor').addEventListener('click', () => openColorPicker('Màu nền Taskbar', tbColor, (c) => { tbColor = c; ls.set('linuxweb_tb_color', c); applyTheme() }));
  b.querySelector('#spTbText').addEventListener('click', () => openColorPicker('Màu chữ Taskbar', tbText, (c) => { tbText = c; ls.set('linuxweb_tb_text', c); applyTheme() }));

  const PKGS = ['firefox', 'vim', 'htop', 'git', 'python', 'nano', 'neofetch', 'mpv'];
  const getPkgs = () => { try { const a = JSON.parse(ls.get('linuxweb_pkgs')); if (Array.isArray(a)) return a } catch (e) { } return ['bash', 'coreutils'] };
  const setPkgs = (a) => ls.set('linuxweb_pkgs', JSON.stringify(a));
  b.querySelector('#spUpdate').addEventListener('click', () => {
    const bd = document.createElement('div'); bd.innerHTML = '<div class="log"></div><div class="pbar"><i></i></div>';
    const log = bd.querySelector('.log'), bar = bd.querySelector('i');
    const steps = ['Đồng bộ cơ sở dữ liệu...', 'Kiểm tra phụ thuộc...', 'Tải 12 gói...', 'Cài đặt gói...', 'Dọn cache...']; let i = 0;
    openModal('Cập nhật hệ thống', bd);
    const t = setInterval(() => {
      if (!document.body.contains(bd)) { clearInterval(t); return }
      if (i < steps.length) { log.textContent += steps[i] + '\n'; i++; bar.style.width = (i / (steps.length + 1) * 100) + '%' }
      else { clearInterval(t); bar.style.width = '100%'; log.textContent += 'Hoàn tất. Hệ thống đã được cập nhật (giả lập).' }
    }, 650);
  });
  b.querySelector('#spPkg').addEventListener('click', () => {
    const bd = document.createElement('div');
    const draw = () => {
      bd.innerHTML = ''; const inst = getPkgs();
      PKGS.forEach((p) => {
        const row = document.createElement('div'); row.className = 'pkg-row'; const n = document.createElement('span'); n.textContent = p; row.appendChild(n);
        const btn = document.createElement('button'); btn.className = 'sp-btn' + (inst.includes(p) ? ' danger' : ''); btn.textContent = inst.includes(p) ? 'Gỡ' : 'Cài';
        btn.onclick = () => { btn.disabled = true; btn.textContent = '...'; setTimeout(() => { const a = getPkgs(); if (a.includes(p)) setPkgs(a.filter((x) => x !== p)); else { a.push(p); setPkgs(a) } draw() }, 900) };
        row.appendChild(btn); bd.appendChild(row);
      });
    }; draw(); openModal('Quản lý gói (pacman)', bd);
  });
  b.querySelector('#spTerm').addEventListener('click', () => openTerminal(false));
  b.querySelector('#spAndroid').addEventListener('click', () => { launch({ name: 'Cài đặt Android', target: 'com.android.settings' }) });

  renderClockSec();
  renderStretchBtn();
  updateWpPreview();
}

$('settingsBtn').addEventListener('click',e=>{e.stopPropagation();dropdown.classList.remove('show');openSettings()});

window.addEventListener('resize',()=>{applyDpi();renderDesk();refreshWindows();closeCtx()});
window.addEventListener('orientationchange',()=>setTimeout(()=>{applyDpi();renderDesk();refreshWindows()},150));
applyOpacity();renderWs();applyBackground();applyHz();refresh();updateClock();renderWinBar();

}catch(error){
  document.body.innerHTML='<div style="color:#f87171;padding:20px;font-size:16px;white-space:pre-wrap"></div>';
  document.body.firstChild.textContent='Lỗi JavaScript: '+error.message+(error.stack?'\n'+error.stack.split('\n')[1]:'');
}
})();
