<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Đặt hình nền</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: manipulation; }

    body { background-size: cover; background-position: center; background-repeat: no-repeat; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    #fileInput, #iconInput { display: none; }
    
    /* Trả thanh top-bar về độ dày 32px ban đầu */
    .top-bar { position: fixed; top: 0; left: 0; width: 100%; height: 32px; background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); z-index: 10000; pointer-events: none; }
    .clock { position: static; order: 2; flex: 0 0 auto; height: 32px; display: flex; align-items: center; color: #fff; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6); z-index: 10001; pointer-events: none; white-space: nowrap; }
    
    .square-icon { position: fixed; top: 0; left: 8px; height: 32px; width: 32px; z-index: 10002; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .square-icon img { width: 24px; height: 24px; object-fit: contain; display: block; }

    /* Vùng bấm mở rộng (Hitbox) kéo dài xuống dưới để dễ chạm, không ảnh hưởng giao diện */
    .hitbox-dropdown {
      position: fixed;
      top: 0; left: 0;
      width: 60px; 
      height: 90px; 
      z-index: 10001;
      cursor: pointer;
      background: transparent;
    }

    /* App ghim trên taskbar, nằm ngay cạnh logo bên trái */
    /* Cụm bên trái taskbar: [app ghim] [đồng hồ] */
    .taskbar-left { position: fixed; top: 0; left: 44px; right: 12px; height: 32px; display: flex; align-items: center; gap: 8px; z-index: 10002; pointer-events: none; }
    .pinned-bar { order: 0; flex: 1 1 0; min-width: 0; height: 32px; display: flex; align-items: center; gap: 4px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; pointer-events: none; }
    .pinned-bar::-webkit-scrollbar { display: none; }
    .pinned-item { pointer-events: auto; flex: 0 0 auto; max-width: 90px; padding: 3px 8px; border-radius: 0; background: rgba(0, 0, 0, 0.28); color: #fff; font-family: system-ui, sans-serif; font-size: 12px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .pinned-item:active { background: rgba(0, 0, 0, 0.5); }

    .dropdown { position: fixed; top: 32px; left: 0; background: rgba(30, 30, 30, 0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); width: 300px; max-width: 100vw; height: 480px; max-height: calc(100vh - 32px - 40px); display: none; flex-direction: column; z-index: 10003; overflow: hidden; }
    .dropdown.show { display: flex; }
    
    .search-bar { padding: 8px 12px; flex-shrink: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .search-bar input { width: 100%; padding: 8px 14px; background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid #3b82f6; outline: none; border-radius: 16px; font-family: system-ui, sans-serif; font-size: 13px; }
    .search-bar input::placeholder { color: rgba(255, 255, 255, 0.5); }
    
    .body-area { display: flex; flex: 1; min-height: 0; }
    .main-column, .sub-column { width: 50%; flex-shrink: 0; display: flex; flex-direction: column; min-width: 0; position: relative; }
    .sub-column { background: rgba(0, 0, 0, 0.2); }
    .main-list, .sub-list { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.3) transparent; padding: 0 0 36px 0; display: flex; flex-direction: column; }
    .sub-list { padding: 4px 0 36px 0; }
    
    .dropdown-item { flex: 0 0 auto; width: 100%; padding: 10px 12px; color: #fff; font-family: system-ui, sans-serif; font-size: 13px; text-align: left; cursor: pointer; background: transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid rgba(255, 255, 255, 0.05); outline: none; }
    .dropdown-item.active { background: rgba(255, 255, 255, 0.18); }
    
    .add-btn, .add-sub-btn { position: absolute; left: 0; bottom: 0; width: 100%; padding: 8px 10px; color: #60a5fa; font-family: system-ui, sans-serif; font-size: 11px; cursor: pointer; text-align: left; background: rgba(30, 30, 30, 0.5); border-top: 1px solid rgba(255, 255, 255, 0.08); box-sizing: border-box; }
    
    .sub-item { flex: 0 0 auto; padding: 8px 10px; color: rgba(255, 255, 255, 0.85); font-family: system-ui, sans-serif; font-size: 13px; cursor: pointer; white-space: nowrap; overflow: hidden; display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .sub-item-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .app-icon { flex: 0 0 auto; display: block; border-radius: 0; object-fit: contain; }
    .app-icon-letter { display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.18); color: #fff; font-size: 11px; font-weight: 600; font-family: system-ui, sans-serif; }
    .pinned-item.icon-only { display: flex; align-items: center; padding: 3px 4px; background: transparent; }
    .sub-item-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub-item-target { font-size: 10px; color: rgba(255, 255, 255, 0.45); }
    
    .empty-text { padding: 12px 16px; color: rgba(255, 255, 255, 0.4); font-size: 12px; text-align: center; }
    
    .bottom-bar { flex-shrink: 0; height: 36px; background: rgba(255, 255, 255, 0.06); border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; align-items: center; position: relative; }
    .bottom-logo { margin-left: 12px; height: 20px; width: 20px; object-fit: contain; display: block; }
    .bottom-label { margin-left: 8px; color: #fff; font-family: system-ui, sans-serif; font-size: 13px; font-weight: 500; }
    
    .ctx-menu { position: fixed; background: rgba(35, 35, 35, 0.98); border: 1px solid rgba(255, 255, 255, 0.15); padding: 0; z-index: 45000; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6); font-family: system-ui, sans-serif; font-size: 13px; color: #fff; min-width: 140px; overflow: hidden; }
    .ctx-menu .ctx-item { padding: 8px 14px; cursor: pointer; white-space: nowrap; }
    .ctx-menu .ctx-item:hover { background: rgba(255, 255, 255, 0.12); }
    .ctx-menu .ctx-item.danger { color: #f87171; }
    .rename-input { width: 100%; padding: 2px 4px; background: #1e1e1e; color: #fff; border: 1px solid #3b82f6; outline: none; font-size: 13px; border-radius: 2px; box-sizing: border-box; }
    .rename-target-input { font-size: 11px; padding: 1px 3px; }
  </style>
</head>
<body>

  <div class="top-bar"></div>
  <!-- đồng hồ nằm trong .taskbar-left -->
  
  <div class="square-icon" id="squareIcon" role="button" tabindex="0">
    <img src="file:///android_asset/test.png" alt="menu">
  </div>

  <!-- Vùng bấm ẩn kéo dài xuống dưới -->
  <div class="hitbox-dropdown" id="hitboxDropdown"></div>

  <!-- Các app đã ghim -->
  <div class="taskbar-left" id="taskbarLeft">
    <div class="pinned-bar" id="pinnedBar"></div>
    <div class="clock" id="clock"></div>
  </div>
  
  <div class="dropdown" id="dropdown">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Tìm kiếm...">
    </div>
    <div class="body-area">
      <div class="main-column">
        <div class="main-list" id="mainList"></div>
        <div class="add-btn" id="addMainBtn">+ Mục</div>
      </div>
      <div class="sub-column">
        <div class="sub-list" id="subList"></div>
        <div class="add-sub-btn" id="addSubBtn" style="display:none;">+ Thêm app</div>
      </div>
    </div>
    <div class="bottom-bar">
      <img src="file:///android_asset/logo.png" class="bottom-logo" id="bottomLogo">
      <span class="bottom-label">linux</span>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*">
  <input type="file" id="iconInput" accept="image/*">

  <script>
    (function() {
      'use strict';
      try {
        const fileInput      = document.getElementById('fileInput');
        const clock          = document.getElementById('clock');
        const squareIcon     = document.getElementById('squareIcon');
        const hitboxDropdown = document.getElementById('hitboxDropdown');
        const dropdown       = document.getElementById('dropdown');
        const searchInput    = document.getElementById('searchInput');
        const mainList       = document.getElementById('mainList');
        const subList        = document.getElementById('subList');
        const addMainBtn     = document.getElementById('addMainBtn');
        const addSubBtn      = document.getElementById('addSubBtn');
        
        const LS_SECTIONS = 'linuxweb_sections_v2';
        const LS_ACTIVE   = 'linuxweb_activeIndex_v2';
        const LS_BG_IMG   = 'linuxweb_bg_img';
        const LS_BG_VID   = 'linuxweb_bg_vid'; // chỉ dùng để dọn dữ liệu video cũ

        let sections = loadSections();
        let activeIndex = loadActive();
        let searchTerm = '';

        // ===== App ghim trên taskbar =====
        const pinnedBar  = document.getElementById('pinnedBar');
        const taskbarLeft = document.getElementById('taskbarLeft');
        const LS_PINNED  = 'linuxweb_pinned_v1';
        let pinned = loadPinned();

        function loadPinned() {
          try {
            const raw = localStorage.getItem(LS_PINNED);
            if (raw) {
              const p = JSON.parse(raw);
              if (Array.isArray(p)) return p.filter((a) => a && a.name).map((a) => ({ name: String(a.name), target: String(a.target || '') }));
            }
          } catch (e) {}
          return [];
        }
        function savePinned() { try { localStorage.setItem(LS_PINNED, JSON.stringify(pinned)); } catch (e) {} }
        function pinnedIndex(app) { return pinned.findIndex((p) => p.name === app.name && p.target === (app.target || '')); }
        function togglePin(app) {
          const i = pinnedIndex(app);
          if (i >= 0) pinned.splice(i, 1); else pinned.push({ name: app.name, target: app.target || '' });
          refresh();
        }
        function updatePinned(oldApp, newName, newTarget) {
          const i = pinnedIndex(oldApp);
          if (i >= 0) pinned[i] = { name: newName, target: newTarget };
        }
        function findApp(p) {
          for (const s of sections) for (const a of (s.apps || [])) { if (a.name === p.name && (a.target || '') === p.target) return a; }
          return null;
        }

        // Lấy icon app từ Android (AndroidApp.getAppIcon trả về base64 PNG hoặc data URI)
        const iconCache = {};
        function getAppIconSrc(target) {
          if (!target) return '';
          if (iconCache[target]) return iconCache[target];
          let src = '';
          try {
            if (window.AndroidApp && typeof window.AndroidApp.getAppIcon === 'function') {
              const r = window.AndroidApp.getAppIcon(target);
              if (r) src = String(r).indexOf('data:') === 0 ? String(r) : 'data:image/png;base64,' + r;
            }
          } catch (e) {}
          if (src) iconCache[target] = src;
          return src;
        }
        function makeIcon(app, size) {
          const src = app.icon || getAppIconSrc(app.target);
          let el;
          if (src) { el = document.createElement('img'); el.src = src; el.draggable = false; }
          else { el = document.createElement('div'); el.className = 'app-icon-letter'; el.textContent = (app.name || '?').charAt(0).toUpperCase(); }
          el.classList.add('app-icon');
          el.style.width = size + 'px'; el.style.height = size + 'px';
          return el;
        }

        function renderPinned() {
          pinnedBar.innerHTML = '';
          pinned.forEach((p, idx) => {
            const div = document.createElement('div');
            div.className = 'pinned-item'; div.title = p.name;
            div.classList.add('icon-only'); div.appendChild(makeIcon(findApp(p) || p, 22));
            div.addEventListener('click', (e) => {
              e.stopPropagation();
              if (p.target && window.AndroidApp) window.AndroidApp.openApp(p.target);
            });
            const openMenu = (x, y) => showCtxMenu(x, y, [{ label: 'Đổi ảnh', action: () => { const fa = findApp(p); if (fa) pickIcon({ type: 'app', app: fa }); } }, { label: 'Bỏ ghim', danger: true, action: () => { pinned.splice(idx, 1); refresh(); } }]);
            div.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); openMenu(e.clientX, e.clientY); });
            attachLongPress(div, openMenu);
            pinnedBar.appendChild(div);
          });
        }

        function normalizeApps(arr) {
          arr.forEach((sec) => {
            if (!Array.isArray(sec.apps)) sec.apps = [];
            sec.apps = sec.apps.map((a) => {
              if (typeof a === 'string') return { name: a, target: '' };
              if (a && typeof a === 'object') { return { name: String(a.name || ''), target: String(a.target || ''), icon: String(a.icon || '') }; }
              return { name: '', target: '' };
            }).filter((a) => a.name);
          });
          return arr;
        }
        function loadSections() {
          try {
            const raw = localStorage.getItem(LS_SECTIONS);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed) && parsed.length) return normalizeApps(parsed);
            }
          } catch (e) {}
          return [];
        }
        function loadActive() {
          const v = parseInt(localStorage.getItem(LS_ACTIVE), 10);
          return (isNaN(v) || v < 0 || v >= sections.length) ? 0 : v;
        }
        function saveSections() { try { localStorage.setItem(LS_SECTIONS, JSON.stringify(sections)); } catch (e) {} }
        function saveActive() { try { localStorage.setItem(LS_ACTIVE, String(activeIndex)); } catch (e) {} }

        let ctxMenuEl = null;
        let renamingEl = null;
        function closeCtxMenu() { if (ctxMenuEl) { ctxMenuEl.remove(); ctxMenuEl = null; } }
        function cancelRename() {
          if (!renamingEl) return;
          const { nameEl, targetEl, originalText, originalTarget, mode } = renamingEl;
          renamingEl = null;
          if (!nameEl || !nameEl.parentNode) return;
          if (mode === 'target') { nameEl.textContent = originalTarget; if (!originalTarget && targetEl && targetEl.parentNode) targetEl.remove(); } else { nameEl.textContent = originalText; }
        }
        
        function startInlineRename(el, currentName, onCommit) {
          cancelRename(); closeCtxMenu();
          let nameEl = el;
          if (el.classList.contains('sub-item')) { nameEl = el.querySelector('.sub-item-name') || el; }
          const originalText = nameEl.textContent; nameEl.textContent = '';
          const input = document.createElement('input'); input.type = 'text'; input.className = 'rename-input'; input.value = currentName; input.maxLength = 60;
          nameEl.appendChild(input);
          renamingEl = { el, nameEl, targetEl: null, originalText, originalTarget: '', mode: 'name' };
          input.focus(); input.select();
          let done = false;
          const commit = () => { if (done) return; done = true; const val = input.value.trim(); renamingEl = null; if (val && val !== currentName) { onCommit(val); } else { nameEl.textContent = originalText; } };
          const cancel = () => { if (done) return; done = true; renamingEl = null; nameEl.textContent = originalText; };
          input.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); commit(); } else if (e.key === 'Escape') { e.preventDefault(); cancel(); } });
          input.addEventListener('blur', commit); input.addEventListener('click', (e) => e.stopPropagation()); input.addEventListener('pointerdown', (e) => e.stopPropagation());
        }
        
        function startInlineTargetEdit(el, currentTarget, onCommit) {
          cancelRename(); closeCtxMenu();
          if (!el.classList.contains('sub-item')) return;
          let targetEl = el.querySelector('.sub-item-target');
          if (!targetEl) { targetEl = document.createElement('div'); targetEl.className = 'sub-item-target'; (el.querySelector('.sub-item-text') || el).appendChild(targetEl); }
          const originalTarget = targetEl.textContent; targetEl.textContent = '';
          const input = document.createElement('input'); input.type = 'text'; input.className = 'rename-input rename-target-input'; input.value = currentTarget; input.maxLength = 300; input.placeholder = 'com.example.app';
          targetEl.appendChild(input);
          renamingEl = { el, nameEl: targetEl, targetEl, originalText: originalTarget, originalTarget, mode: 'target' };
          input.focus(); input.select();
          let done = false;
          const commit = () => { if (done) return; done = true; const val = input.value.trim(); renamingEl = null; if (val !== currentTarget) { onCommit(val); } else { if (originalTarget) targetEl.textContent = originalTarget; else targetEl.remove(); } };
          const cancel = () => { if (done) return; done = true; renamingEl = null; if (originalTarget) targetEl.textContent = originalTarget; else targetEl.remove(); };
          input.addEventListener('keydown', (e) => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); commit(); } else if (e.key === 'Escape') { e.preventDefault(); cancel(); } });
          input.addEventListener('blur', commit); input.addEventListener('click', (e) => e.stopPropagation()); input.addEventListener('pointerdown', (e) => e.stopPropagation());
        }

        function showCtxMenu(x, y, items) {
          closeCtxMenu();
          const menu = document.createElement('div'); menu.className = 'ctx-menu';
          items.forEach((it) => {
            const row = document.createElement('div'); row.className = 'ctx-item' + (it.danger ? ' danger' : ''); row.textContent = it.label;
            row.addEventListener('click', (e) => { e.stopPropagation(); closeCtxMenu(); it.action(); });
            menu.appendChild(row);
          });
          document.body.appendChild(menu); ctxMenuEl = menu;
          const r = menu.getBoundingClientRect();
          let left = x, top = y;
          if (left + r.width > window.innerWidth) left = window.innerWidth - r.width - 4;
          if (top + r.height > window.innerHeight) top = window.innerHeight - r.height - 4;
          if (left < 0) left = 0; if (top < 0) top = 0;
          menu.style.left = left + 'px'; menu.style.top = top + 'px';
        }
        document.addEventListener('click', closeCtxMenu); document.addEventListener('scroll', closeCtxMenu, true); window.addEventListener('resize', closeCtxMenu);

        function renderMain() {
          mainList.innerHTML = '';
          const filtered = sections.map((s, i) => ({ s, i })).filter(({ s }) => !searchTerm || s.name.toLowerCase().includes(searchTerm));
          if (filtered.length === 0) { const empty = document.createElement('div'); empty.className = 'empty-text'; empty.textContent = searchTerm ? 'Không có kết quả' : 'Chưa có mục'; mainList.appendChild(empty); return; }
          filtered.forEach(({ s, i }) => {
            const div = document.createElement('div');
            div.className = 'dropdown-item' + (i === activeIndex ? ' active' : ''); div.textContent = s.name; div.dataset.index = i;
            div.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); openSectionCtxMenu(e.clientX, e.clientY, i, div); });
            attachLongPress(div, (x, y) => openSectionCtxMenu(x, y, i, div));
            mainList.appendChild(div);
          });
        }

        function renderSub() {
          subList.innerHTML = '';
          if (activeIndex < 0 || !sections[activeIndex]) {
            addSubBtn.style.display = 'none';
            const empty = document.createElement('div'); empty.className = 'empty-text'; empty.textContent = 'Chọn một mục'; subList.appendChild(empty); return;
          }
          const section = sections[activeIndex]; const apps = section.apps || [];
          if (apps.length === 0) { const empty = document.createElement('div'); empty.className = 'empty-text'; empty.textContent = 'Chưa có app nào'; subList.appendChild(empty); } 
          else {
            apps.forEach((appObj, appIdx) => {
              const div = document.createElement('div'); div.className = 'sub-item'; div.appendChild(makeIcon(appObj, 22)); const textEl = document.createElement('div'); textEl.className = 'sub-item-text'; div.appendChild(textEl);
              const nameEl = document.createElement('div'); nameEl.className = 'sub-item-name'; nameEl.textContent = appObj.name; textEl.appendChild(nameEl);
              if (appObj.target) { const targetEl = document.createElement('div'); targetEl.className = 'sub-item-target'; targetEl.textContent = appObj.target; textEl.appendChild(targetEl); }
              
              div.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); openAppCtxMenu(e.clientX, e.clientY, activeIndex, appIdx, div, appObj); });
              attachLongPress(div, (x, y) => openAppCtxMenu(x, y, activeIndex, appIdx, div, appObj));
              
              div.addEventListener('click', () => {
                  if (appObj.target && window.AndroidApp) {
                      window.AndroidApp.openApp(appObj.target);
                      dropdown.classList.remove('show');
                  }
              });
              
              subList.appendChild(div);
            });
          }
          addSubBtn.style.display = 'block';
        }

        function openSectionCtxMenu(x, y, sectionIdx, el) {
          const section = sections[sectionIdx]; if (!section) return; const items = [];
          items.push({ label: 'Đổi tên', action: () => { startInlineRename(el, section.name, (newName) => { section.name = newName; refresh(); }); } });
          items.push({ label: 'Xóa', danger: true, action: () => { sections.splice(sectionIdx, 1); if (activeIndex >= sections.length) activeIndex = sections.length - 1; if (activeIndex < 0) activeIndex = 0; refresh(); } });
          showCtxMenu(x, y, items);
        }
        
        function openAppCtxMenu(x, y, sectionIdx, appIdx, el, appObj) {
          const section = sections[sectionIdx]; if (!section) return; const items = [];
          items.push({ label: 'Đổi tên', action: () => { startInlineRename(el, appObj.name, (newName) => { updatePinned(appObj, newName, appObj.target || ''); section.apps[appIdx].name = newName; refresh(); }); } });
          items.push({ label: 'Đổi đường dẫn', action: () => { startInlineTargetEdit(el, appObj.target || '', (newTarget) => { updatePinned(appObj, appObj.name, newTarget); section.apps[appIdx].target = newTarget; refresh(); }); } });
          items.push({ label: 'Đổi ảnh', action: () => { pickIcon({ type: 'app', app: appObj }); } });
          if (appObj.icon) items.push({ label: 'Xóa ảnh riêng', action: () => { resetIcon({ type: 'app', app: appObj }); } });
          items.push({ label: pinnedIndex(appObj) >= 0 ? 'Bỏ ghim khỏi taskbar' : 'Ghim lên taskbar', action: () => { togglePin(appObj); } });
          items.push({ label: 'Xóa', danger: true, action: () => { const pi = pinnedIndex(appObj); if (pi >= 0) pinned.splice(pi, 1); section.apps.splice(appIdx, 1); refresh(); } });
          showCtxMenu(x, y, items);
        }

        function attachLongPress(el, callback) {
          let timer = null; let startX = 0, startY = 0; let fired = false;
          const cancel = () => { clearTimeout(timer); timer = null; };
          el.addEventListener('pointerdown', (e) => { if (e.button !== undefined && e.button !== 0) return; fired = false; startX = e.clientX; startY = e.clientY; cancel(); timer = setTimeout(() => { fired = true; callback(e.clientX, e.clientY); }, 500); });
          el.addEventListener('pointermove', (e) => { if (!timer) return; if (Math.hypot(e.clientX - startX, e.clientY - startY) > 10) cancel(); });
          el.addEventListener('pointerup', () => cancel()); el.addEventListener('pointercancel', () => cancel()); el.addEventListener('pointerleave', () => cancel());
          el.addEventListener('click', (e) => { if (fired) { e.stopImmediatePropagation(); e.stopPropagation(); e.preventDefault(); fired = false; } }, true);
        }

        function refresh() { renderMain(); renderSub(); renderPinned(); saveSections(); saveActive(); savePinned(); }

        addMainBtn.addEventListener('click', (e) => {
          e.stopPropagation(); cancelRename(); closeCtxMenu();
          let n = 1; const existing = new Set(sections.map(s => s.name));
          while (existing.has('New folder ' + n)) n++;
          sections.push({ name: 'New folder ' + n, apps: [] });
          if (activeIndex < 0) activeIndex = sections.length - 1;
          refresh();
        });
        
        addSubBtn.addEventListener('click', (e) => {
          e.stopPropagation(); cancelRename(); closeCtxMenu();
          if (activeIndex < 0 || !sections[activeIndex]) return;
          const arr = sections[activeIndex].apps;
          let n = 1; const existing = new Set(arr.map(a => a.name));
          while (existing.has('App ' + n)) n++;
          arr.push({ name: 'App ' + n, target: '' });
          refresh();
        });
        
        mainList.addEventListener('click', (e) => {
          e.stopPropagation(); if (renamingEl) return;
          const item = e.target.closest('.dropdown-item'); if (!item) return;
          activeIndex = Number(item.dataset.index);
          searchTerm = ''; searchInput.value = ''; refresh();
        });

        searchInput.addEventListener('input', (e) => { searchTerm = e.target.value.trim().toLowerCase(); renderMain(); });

        function toggleDropdown() { dropdown.classList.toggle('show'); }
        
        squareIcon.addEventListener('click', (e) => { e.stopPropagation(); toggleDropdown(); });
        hitboxDropdown.addEventListener('click', (e) => { e.stopPropagation(); toggleDropdown(); });

        document.addEventListener('click', (e) => { if (!dropdown.contains(e.target) && !squareIcon.contains(e.target) && !hitboxDropdown.contains(e.target)) { dropdown.classList.remove('show'); } });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { dropdown.classList.remove('show'); closeCtxMenu(); cancelRename(); } });

        // ===== Xử lý hình nền (chỉ ảnh từ thư viện) =====
        const LONG_PRESS_MS = 500;
        let pressTimer = null; let pressStartX = 0, pressStartY = 0;
        function cancelPress() { clearTimeout(pressTimer); pressTimer = null; }
        
        document.addEventListener('pointerdown', (e) => { 
            if (squareIcon.contains(e.target) || dropdown.contains(e.target) || hitboxDropdown.contains(e.target) || taskbarLeft.contains(e.target)) return;
            if (e.button !== undefined && e.button !== 0) return;
            pressStartX = e.clientX; pressStartY = e.clientY; cancelPress(); 
            pressTimer = setTimeout(() => { fileInput.click(); }, LONG_PRESS_MS); 
        });

        document.addEventListener('pointermove', (e) => { if (!pressTimer) return; const dx = e.clientX - pressStartX; const dy = e.clientY - pressStartY; if (Math.hypot(dx, dy) > 10) cancelPress(); });
        document.addEventListener('pointerup', cancelPress); document.addEventListener('pointercancel', cancelPress); document.addEventListener('pointerleave', cancelPress); window.addEventListener('blur', cancelPress);
        document.addEventListener('contextmenu', (e) => { if (e.target.closest('.ctx-menu')) return; e.preventDefault(); });

        fileInput.addEventListener('change', (event) => {
          const file = event.target.files && event.target.files[0];
          if (!file || !file.type.startsWith('image/')) { fileInput.value = ''; return; }
          const reader = new FileReader();
          reader.onload = (e) => { 
              const url = e.target.result; 
              document.body.style.backgroundImage = `url('${url}')`; 
              try { localStorage.setItem(LS_BG_IMG, url); } catch (err) {} 
          };
          reader.readAsDataURL(file); fileInput.value = '';
        });

        (function restoreBackground() { 
            try { 
                localStorage.removeItem(LS_BG_VID); // dọn video cũ nếu có
                const bgImg = localStorage.getItem(LS_BG_IMG); 
                if (bgImg) {
                    document.body.style.backgroundImage = `url('${bgImg}')`; 
                }
            } catch (e) {} 
        })();

        function updateClock() {
          const now = new Date(); const hh = String(now.getHours()).padStart(2, '0'); const mm = String(now.getMinutes()).padStart(2, '0'); const ss = String(now.getSeconds()).padStart(2, '0'); const dd = String(now.getDate()).padStart(2, '0'); const mo = String(now.getMonth() + 1).padStart(2, '0'); const yyyy = now.getFullYear();
          clock.textContent = `${hh}:${mm}:${ss}  ${dd}/${mo}/${yyyy}`;
        }
        updateClock(); setInterval(updateClock, 1000);

        // ===== Đổi ảnh: logo trên cùng (test.png), logo dưới (logo.png) và ảnh từng app =====
        const iconInput  = document.getElementById('iconInput');
        const squareImg  = squareIcon.querySelector('img');
        const bottomLogo = document.getElementById('bottomLogo');
        const LS_IMG_TEST = 'linuxweb_img_test';
        const LS_IMG_LOGO = 'linuxweb_img_logo';
        const DEF_TEST = 'file:///android_asset/test.png';
        const DEF_LOGO = 'file:///android_asset/logo.png';
        let iconTarget = null;

        try {
          const t = localStorage.getItem(LS_IMG_TEST); if (t) squareImg.src = t;
          const l = localStorage.getItem(LS_IMG_LOGO); if (l) bottomLogo.src = l;
        } catch (e) {}

        function pickIcon(t) { iconTarget = t; iconInput.value = ''; iconInput.click(); }

        function applyIcon(t, url) {
          if (t.type === 'test') { squareImg.src = url; try { localStorage.setItem(LS_IMG_TEST, url); } catch (e) {} }
          else if (t.type === 'logo') { bottomLogo.src = url; try { localStorage.setItem(LS_IMG_LOGO, url); } catch (e) {} }
          else if (t.type === 'app' && t.app) { t.app.icon = url; refresh(); }
        }
        function resetIcon(t) {
          if (t.type === 'test') { squareImg.src = DEF_TEST; try { localStorage.removeItem(LS_IMG_TEST); } catch (e) {} }
          else if (t.type === 'logo') { bottomLogo.src = DEF_LOGO; try { localStorage.removeItem(LS_IMG_LOGO); } catch (e) {} }
          else if (t.type === 'app' && t.app) { t.app.icon = ''; refresh(); }
        }

        iconInput.addEventListener('change', (ev) => {
          const file = ev.target.files && ev.target.files[0];
          const t = iconTarget; iconTarget = null;
          if (!file || !t || !file.type.startsWith('image/')) { iconInput.value = ''; return; }
          const reader = new FileReader();
          reader.onload = (e) => {
            const raw = e.target.result;
            const img = new Image();
            img.onload = () => {
              // Thu nhỏ ảnh để lưu gọn trong localStorage
              const max = 128; const s = Math.min(1, max / Math.max(img.width, img.height));
              const w = Math.max(1, Math.round(img.width * s)); const h = Math.max(1, Math.round(img.height * s));
              const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
              cv.getContext('2d').drawImage(img, 0, 0, w, h);
              let url = raw; try { url = cv.toDataURL('image/png'); } catch (err) {}
              applyIcon(t, url);
            };
            img.onerror = () => applyIcon(t, raw);
            img.src = raw;
          };
          reader.readAsDataURL(file); iconInput.value = '';
        });

        [[squareIcon, { type: 'test' }], [bottomLogo, { type: 'logo' }]].forEach(([el, t]) => {
          const open = (x, y) => showCtxMenu(x, y, [
            { label: 'Đổi ảnh', action: () => pickIcon(t) },
            { label: 'Khôi phục ảnh gốc', action: () => resetIcon(t) }
          ]);
          el.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); open(e.clientX, e.clientY); });
          attachLongPress(el, open);
        });
        dropdown.addEventListener('click', (e) => e.stopPropagation());
        refresh();
      } catch (error) {
        document.body.innerHTML = `<div style="color:red; padding:20px; font-size:20px;">Lỗi JavaScript: ${error.message}</div>`;
      }
    })();
  </script>
</body>
</html>
