<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Linux Desktop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:manipulation}
body{background:#000 center/cover no-repeat;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-family:system-ui,sans-serif;color:#fff}
input,textarea,button{font-family:inherit}
#fileInput,#iconInput,#videoInput{display:none}
:root{--tb-bg:rgba(255,255,255,.2);--tbh:32px;--sp-a:.6}
#ui{position:fixed;left:0;top:0;transform-origin:0 0}
#videoBg{position:fixed;inset:0;z-index:0;object-fit:cover;display:none;background:#000}
.top-bar{position:fixed;top:0;left:0;width:100%;height:var(--tbh);background:var(--tb-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:10000;pointer-events:none}
.clock{margin-left:auto;flex:0 0 auto;height:var(--tbh);display:flex;align-items:center;padding-right:12px;font-size:13px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:pre;pointer-events:none}
.square-icon{position:fixed;top:0;left:8px;height:var(--tbh);width:var(--tbh);z-index:10002;cursor:pointer;display:flex;align-items:center;justify-content:center}
.square-icon img{width:75%;height:75%;object-fit:contain}
.taskbar{position:fixed;top:0;left:calc(var(--tbh) + 12px);right:0;height:var(--tbh);display:flex;align-items:center;gap:8px;z-index:10002;pointer-events:none}
.pinned-bar{flex:0 1 auto;min-width:0;height:var(--tbh);display:flex;align-items:center;gap:4px;overflow:auto hidden;scrollbar-width:none}
.pinned-bar::-webkit-scrollbar{display:none}
.pinned-item{pointer-events:auto;flex:0 0 auto;max-width:90px;padding:3px 8px;background:rgba(0,0,0,.28);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pinned-item.win-on{background:rgba(96,165,250,.5)}
.pinned-item.icon-only{height:var(--tbh);display:flex;align-items:center;padding:3px 6px;background:transparent}
.ws-div{flex:0 0 auto;width:1px;height:20px;opacity:.4}
.workspaces{display:flex;align-items:center}
.ws{pointer-events:auto;height:var(--tbh);width:26px;line-height:var(--tbh);text-align:center;font-size:13px;cursor:pointer;text-shadow:0 1px 3px #000}
.ws.active{color:#60a5fa;font-weight:700}
#winBar{flex:1 1 auto}
.clock,.pinned-item,.ws{color:var(--tb-color,#fff)}
.ws-div{background:var(--tb-color,#fff)}
.dropdown{position:fixed;top:var(--tbh);left:0;background:rgba(30,30,30,.85);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);width:320px;max-width:100%;height:500px;max-height:calc(100% - var(--tbh) - 10px);display:none;flex-direction:column;z-index:44000;overflow:hidden;box-shadow:4px 4px 20px rgba(0,0,0,.5)}
.dropdown.show{display:flex;animation:fadeUp .18s ease-out}
.search-bar{padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.search-bar input{width:100%;padding:8px 14px;background:rgba(255,255,255,.08);color:#fff;border:1px solid #3b82f6;outline:none;border-radius:16px;font-size:13px}
.body-area{display:flex;flex:1;min-height:0}
.col{width:50%;display:flex;flex-direction:column;min-width:0;position:relative}
.col+.col{background:rgba(0,0,0,.2)}
.list{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;padding-bottom:36px}
.ditem{padding:10px 12px;font-size:13px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid rgba(255,255,255,.05)}
.ditem.active{background:rgba(255,255,255,.18)}
.addbtn{position:absolute;left:0;bottom:0;width:100%;padding:8px 10px;color:#60a5fa;font-size:11px;cursor:pointer;background:rgba(30,30,30,.5);border-top:1px solid rgba(255,255,255,.08)}
.sub-item{padding:8px 10px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;overflow:hidden}
.sub-item:active{background:rgba(255,255,255,.12)}
.sub-t{min-width:0;display:flex;flex-direction:column}
.sub-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-g{font-size:10px;color:rgba(255,255,255,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-icon{flex:0 0 auto;object-fit:cover}
.app-icon-letter{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);color:#fff;font-weight:700}
.empty{padding:14px;color:rgba(255,255,255,.4);font-size:12px;text-align:center}
.bottom-bar{height:36px;background:rgba(255,255,255,.06);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:center}
.bottom-bar img{margin-left:12px;height:20px;width:20px;object-fit:contain}
.bottom-bar b{margin-left:8px;font-size:13px;font-weight:500}
.settings-btn{margin-left:auto;margin-right:6px;height:36px;padding:0 10px;display:flex;align-items:center;font-size:13px;cursor:pointer}
.ctx-menu{position:fixed;background:rgba(35,35,40,.98);border:1px solid rgba(255,255,255,.15);z-index:45000;box-shadow:0 8px 24px rgba(0,0,0,.6);font-size:13px;min-width:150px;animation:fadeUp .15s ease-out}
.ctx-item{padding:9px 14px;cursor:pointer;white-space:nowrap}
.ctx-item:active{background:rgba(255,255,255,.12)}
.ctx-item.danger{color:#f87171}
.sp{position:fixed;background:rgba(28,28,30,var(--sp-a));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:8px;border:1px solid rgba(255,255,255,.28);box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:20000;display:none;flex-direction:column;overflow:hidden}
.sp.show{display:flex}
.sp.closing{animation:wClose .22s ease-in forwards;pointer-events:none}
.sp.a-open{animation:wOpen .26s cubic-bezier(.34,1.4,.64,1) both}
.sp.a-min{animation:wMin .23s ease-in both}
.sp.animsize{transition:left .28s,top .28s,width .28s,height .28s}
@keyframes wOpen{0%{opacity:0;transform:scale(.82)}55%{opacity:1;transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
@keyframes wMin{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.5) translateY(40px)}}
@keyframes wClose{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.82)}}
@keyframes fadeUp{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.25)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.bouncing{animation:bounce .4s}
.sp.max{border:none;border-radius:0}
.sp-head{flex:0 0 auto;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 16px 0 14px;touch-action:none;cursor:move;border-bottom:1px solid rgba(255,255,255,.1);font-size:14px;font-weight:600}
.sp.max .sp-head{cursor:default}
.sp-wbtns{display:flex;gap:2px}
.sp-wbtn{width:36px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.sp-wbtn:active{background:rgba(255,255,255,.2)}
.sp-x:active{background:#e81123}
.sp-body{flex:1;display:flex;min-height:0;position:relative}
.sp-h{position:absolute;width:20px;height:20px;z-index:5;touch-action:none}
.sp.max .sp-h{display:none}
.sp-h[data-c=tl]{left:-6px;top:-6px}.sp-h[data-c=tr]{right:-6px;top:-6px}.sp-h[data-c=bl]{left:-6px;bottom:-6px}.sp-h[data-c=br]{right:-6px;bottom:-6px}
.sp-h[data-c=t]{left:14px;right:14px;width:auto;height:12px;top:-6px}
.sp-h[data-c=b]{left:14px;right:14px;width:auto;height:12px;bottom:-6px}
.sp-h[data-c=l]{top:14px;bottom:14px;height:auto;width:12px;left:-6px}
.sp-h[data-c=r]{top:14px;bottom:14px;height:auto;width:12px;right:-6px}
.modal-bk{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:46000;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.modal{width:min(92%,380px);max-height:92%;display:flex;flex-direction:column;background:rgba(28,28,32,.98);border:1px solid rgba(255,255,255,.25);box-shadow:0 10px 30px rgba(0,0,0,.7)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.12);font-size:14px;font-weight:600}
.modal-x{cursor:pointer;padding:0 6px}
.modal-b{overflow-y:auto;padding:12px}
.dlg-msg{white-space:pre-wrap;font-size:13px;margin-bottom:12px;word-break:break-word}
.dlg-input{width:100%;padding:8px;background:#1e1e22;color:#fff;border:1px solid #3b82f6;outline:none;font-size:14px;margin-bottom:12px}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{padding:7px 12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:12px;cursor:pointer;border-radius:3px}
.btn:active{background:rgba(255,255,255,.25)}
.btn.on{background:#3b82f6;border-color:#3b82f6}.btn.danger{color:#f87171}
.desktop{position:fixed;inset:0;z-index:10001;pointer-events:none}
.desk-item{position:absolute;touch-action:none;pointer-events:auto;display:flex;flex-direction:column;align-items:center;padding-top:6px;gap:4px;cursor:pointer}
.desk-item:active{background:rgba(255,255,255,.15)}
.desk-name{font-size:12px;line-height:1.2;text-align:center;text-shadow:0 1px 3px #000;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.fm{display:flex;flex-direction:column;width:100%;height:100%;background:#2b2d33;color:#e5e5e5}
.fm-tb{display:flex;align-items:center;gap:4px;padding:6px 8px;background:#33363d;border-bottom:1px solid #1d1f24}
.fm-tb button{min-width:30px;height:28px;padding:0 8px;background:transparent;border:none;color:#ddd;border-radius:4px;font-size:13px;white-space:nowrap}
.fm-tb button:active{background:rgba(255,255,255,.12)}
.fm-tb button:disabled{opacity:.3}
.fm-path{flex:1;display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none;padding:3px 8px;font-size:12px;white-space:nowrap;background:#24262b;border-radius:4px;margin:0 4px}
.fm-path::-webkit-scrollbar{display:none}
.crumb{padding:3px 5px;border-radius:4px;cursor:pointer;color:#aab}
.crumb.last{color:#fff;font-weight:600}
.fm-main{flex:1;display:flex;min-height:0}
.fm-side{flex:0 0 140px;background:#26282d;border-right:1px solid #1d1f24;overflow-y:auto;padding:6px 0;font-size:12px}
.fm-sitem{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;color:#ccc;white-space:nowrap}
.fm-sitem svg{width:16px;height:16px;flex:0 0 auto}
.fm-sitem.active{background:rgba(59,130,246,.3);color:#fff}
.fm-grid{flex:1;overflow-y:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));grid-auto-rows:min-content;gap:6px;align-content:start}
.fm-it{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:6px;cursor:pointer;text-align:center;font-size:12px;word-break:break-all}
.fm-it:active{background:rgba(59,130,246,.3)}
.fm-it svg{width:44px;height:44px}
.fm-it span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fm-empty{grid-column:1/-1;padding:20px;text-align:center;color:#777;font-size:12px}
.fm-st{padding:4px 12px;background:#33363d;border-top:1px solid #1d1f24;font-size:11px;color:#999;display:flex;justify-content:space-between}
.ed{display:flex;flex-direction:column;width:100%;height:100%;color:#eee}
.ed-menu{display:flex;overflow-x:auto;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(255,255,255,.12);font-size:13px;flex:0 0 auto}
.ed-mi{padding:7px 12px;cursor:pointer;white-space:nowrap}
.ed-mi:active{background:rgba(255,255,255,.18)}
.ed-tab{padding:4px 12px;font-size:12px;background:rgba(0,0,0,.2);border-bottom:1px solid rgba(255,255,255,.1);color:#aaa;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed textarea{flex:1;width:100%;border:none;outline:none;resize:none;padding:8px;background:transparent;color:#fff;font:13px/1.4 monospace;user-select:text;-webkit-user-select:text;white-space:pre-wrap}
.ed-st{display:flex;justify-content:space-between;padding:3px 10px;background:rgba(0,0,0,.25);border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#aaa;flex:0 0 auto}
.sp-nav{flex:0 0 120px;border-right:1px solid rgba(255,255,255,.1);overflow-y:auto;padding:6px 0}
.sp-nav-item{padding:11px 14px;font-size:13px;cursor:pointer;border-left:3px solid transparent}
.sp-nav-item.active{background:rgba(255,255,255,.1);border-left-color:#60a5fa}
.sp-content{flex:1;min-width:0;overflow-y:auto;padding:14px}
.sp-page{display:none}.sp-page.active{display:block;animation:fadeUp .25s ease-out both}
.sp-title{font-size:16px;font-weight:600;margin-bottom:12px}
.sp-preview{width:100%;max-width:280px;aspect-ratio:16/9;background:#000 center/cover no-repeat;border:1px solid rgba(255,255,255,.2);margin-bottom:12px;display:flex;align-items:center;justify-content:center;color:#888;font-size:12px}
.sp-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px}
.sp-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sp-btn{padding:7px 12px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:12px;cursor:pointer}
.sp-btn:active{background:rgba(255,255,255,.25)}
.sp-btn.danger{color:#f87171}.sp-btn.on{background:#3b82f6;border-color:#3b82f6}
.sp-num{width:64px;padding:6px;background:#1e1e1e;border:1px solid rgba(255,255,255,.2);color:#fff;text-align:right;font-size:12px}
.sp-color{width:44px;height:30px;border:1px solid #888;background:none;padding:0}
.sp-sel{position:relative;min-width:120px;font-size:12px}
.sp-sel-cur{position:relative;padding:7px 26px 7px 10px;background:#1e1e1e;border:1px solid rgba(255,255,255,.2);cursor:pointer}
.sp-sel-cur::after{content:'▾';position:absolute;right:9px;top:7px}
.sp-sel-list{display:none;position:absolute;top:100%;left:0;right:0;background:#1e1e1e;border:1px solid rgba(255,255,255,.2);z-index:20}
.sp-sel.open .sp-sel-list{display:block}
.sp-sel-list div{padding:8px 10px;cursor:pointer}.sp-sel-list div.active{background:rgba(255,255,255,.15)}
body[data-tb=bottom] .top-bar,body[data-tb=bottom] .square-icon,body[data-tb=bottom] .taskbar{top:auto;bottom:0}
body[data-tb=bottom] .dropdown{top:auto;bottom:var(--tbh)}
body[data-tb=left] .top-bar,body[data-tb=right] .top-bar{width:var(--tbh);height:100%}
body[data-tb=right] .top-bar{left:auto;right:0}
body[data-tb=left] .square-icon,body[data-tb=right] .square-icon{width:var(--tbh);height:40px;left:0}
body[data-tb=right] .square-icon{left:auto;right:0}
body[data-tb=left] .taskbar,body[data-tb=right] .taskbar{top:44px;bottom:0;left:0;right:auto;width:var(--tbh);height:auto;flex-direction:column;gap:8px}
body[data-tb=right] .taskbar{left:auto;right:0}
body[data-tb=left] .pinned-bar,body[data-tb=right] .pinned-bar{flex-direction:column;width:var(--tbh);height:auto;gap:6px;overflow:hidden auto}
body[data-tb=left] #winBar,body[data-tb=right] #winBar{flex:0 0 auto}
body[data-tb=left] .pinned-item,body[data-tb=right] .pinned-item{width:var(--tbh);max-width:var(--tbh);padding:3px 0;text-align:center;font-size:10px;text-overflow:clip}
body[data-tb=left] .ws-div,body[data-tb=right] .ws-div{width:20px;height:1px}
body[data-tb=left] .workspaces,body[data-tb=right] .workspaces{flex-direction:column}
body[data-tb=left] .clock,body[data-tb=right] .clock{display:none}
body[data-tb=left] .dropdown{top:0;left:var(--tbh)}
body[data-tb=right] .dropdown{top:0;left:auto;right:var(--tbh)}
</style>
</head>
<body data-tb="top">
<video id="videoBg" playsinline loop muted></video>
<div id="ui">
<div class="top-bar"></div>
<div class="square-icon" id="squareIcon" role="button"><img id="sqImg" src="file:///android_asset/test.png" alt="menu"></div>
<div class="desktop" id="desktop"></div>
<div class="taskbar">
<div class="pinned-bar" id="pinnedBar"></div>
<div class="ws-div"></div>
<div class="workspaces"><div class="ws active" data-ws="1">1</div><div class="ws" data-ws="2">2</div><div class="ws" data-ws="3">3</div><div class="ws" data-ws="4">4</div></div>

</div>

<div class="body-area">

</div>
</div>
<input type="file" id="fileInput" accept="image/*">

<script>
(function(){
'use strict';
try{
const $=id=>document.getElementById(id);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const jget=(k,d)=>{try{const v=JSON.parse(ls.get(k));return v==null?d:v}catch(e){return d}};

function openFileManager(start){
  const b=E('div','fm');
  b.innerHTML='<div class="fm-tb"><button data-a="back">←</button><button data-a="fwd">→</button><button data-a="up">↑</button><button data-a="home">⌂</button><div class="fm-path"></div><button data-a="new">+ Thư mục</button></div><div class="fm-main"><div class="fm-side"></div><div class="fm-grid"></div></div><div class="fm-st"><span class="n"></span><span class="c"></span></div>';

  const places=[['Home',HOME],['Bộ nhớ trong','/sdcard'],['Download','/sdcard/Download'],['Pictures','/sdcard/Pictures'],['/storage','/storage'],['File System','/']];
  const q=n=>shQ('./'+n);

  async function paint(){
    b.querySelector('[data-a=back]').disabled=hi<=0;b.querySelector('[data-a=fwd]').disabled=hi>=hist.length-1;
    side.innerHTML='';places.forEach(([l,p])=>{const d=E('div','fm-sitem'+(p===cwd?' active':''));d.innerHTML=SVG_DIR;d.appendChild(E('span','',l));d.onclick=()=>go(p);side.appendChild(d)});

    parts.forEach((p,i)=>{acc+='/'+p;pathEl.appendChild(E('span','',' › '));const c=E('span','crumb'+(i===parts.length-1?' last':''),p),t=acc;c.onclick=()=>go(t);pathEl.appendChild(c)});
    pathEl.scrollLeft=pathEl.scrollWidth;sc.textContent=cwd;

        {label:'Thuộc tính',action:async()=>{const r=await shRun('ls -ld '+q(name),cwd);uiAlert(clean(r.out).trim()||name,'Thuộc tính')}}

const iconInput=$('iconInput'),squareImg=$('sqImg'),bottomLogo=$('logoImg');
const LS_IMG_TEST='linuxweb_img_test',LS_IMG_LOGO='linuxweb_img_logo',DEF_TEST='file:///android_asset/test.png',DEF_LOGO='file:///android_asset/logo.png';
const FALLBACK='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" fill="#2563eb"/><text x="16" y="24" font-size="22" text-anchor="middle" fill="#fff" font-family="sans-serif" font-weight="700">L</text></svg>');
[squareImg,bottomLogo].forEach(i=>{i.addEventListener('error',()=>{if(i.src!==FALLBACK)i.src=FALLBACK});if(i.complete&&i.naturalWidth===0&&i.src!==FALLBACK)i.src=FALLBACK});
let iconTarget=null;
{const t=ls.get(LS_IMG_TEST);if(t)squareImg.src=t;const l=ls.get(LS_IMG_LOGO);if(l)bottomLogo.src=l}
function pickIcon(t){iconTarget=t;iconInput.value='';iconInput.click()}
function applyIcon(t,url){
  if(t.type==='test'){squareImg.src=url;ls.set(LS_IMG_TEST,url)}else if(t.type==='logo'){bottomLogo.src=url;ls.set(LS_IMG_LOGO,url)}else{t.icon=url;refresh()}
}
function resetIcon(t){
  if(t.type==='test'){squareImg.src=DEF_TEST;ls.del(LS_IMG_TEST)}else if(t.type==='logo'){bottomLogo.src=DEF_LOGO;ls.del(LS_IMG_LOGO)}else{t.icon='';refresh()}
}
iconInput.addEventListener('change',ev=>{
  const file=ev.target.files&&ev.target.files[0],t=iconTarget;iconTarget=null;iconInput.value='';
  if(!file||!t||!file.type.startsWith('image/'))return;
  const r=new FileReader();r.onload=e=>{
    const img=new Image();
    img.onload=()=>{const s=Math.min(1,128/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s)),cv=E('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);let u=e.target.result;try{u=cv.toDataURL('image/png')}catch(er){}applyIcon(t,u)};
    img.onerror=()=>applyIcon(t,e.target.result);img.src=e.target.result;
  };r.readAsDataURL(file);
});

function bounce(p){document.querySelectorAll('.desk-item,.pinned-item.icon-only').forEach(el=>{if(el.title===p.name){el.classList.remove('bouncing');void el.offsetWidth;el.classList.add('bouncing');setTimeout(()=>el.classList.remove('bouncing'),400)}})}
function addRecent(p){recent=recent.filter(r=>!same(r,p));recent.unshift({name:p.name,target:p.target||''});recent=recent.slice(0,12);ls.set(KEY_REC,JSON.stringify(recent))}
function launch(p){
  const t=p.target||'';if(!t)return false;
  if(t==='file_manager')openFileManager();
  else if(t==='text_editor')openEditor('','');
  else if(t==='settings')openSettings();
  else if(t.startsWith('url:')){try{window.open(t.slice(4),'_blank')}catch(e){}}
  else if(window.AndroidApp&&typeof window.AndroidApp.openApp==='function'){try{window.AndroidApp.openApp(t)}catch(e){}}
  else return false;
  addRecent(p);bounce(p);return true;
}

const dropdown=$('dropdown'),mainList=$('mainList'),subList=$('subList'),addSubBtn=$('addSubBtn'),searchInput=$('searchInput');
function renderMain(){
  mainList.innerHTML='';const all=secs();let n=0;
  all.forEach((s,i)=>{
    if(searchTerm&&!s.name.toLowerCase().includes(searchTerm))return;n++;
    const d=E('div','ditem'+(i===activeIndex?' active':''),s.name);d.dataset.i=i;
    if(!s.v)ctxOn(d,(x,y)=>showCtx(x,y,[
      {label:'Đổi tên',action:()=>uiPrompt('Tên mục',s.name,v=>{s.name=v;refresh()})},
      {label:'Xóa',danger:true,action:()=>uiConfirm('Xóa mục "'+s.name+'"?',()=>{sections.splice(i,1);if(activeIndex>=sections.length)activeIndex=0;refresh()})}]));
    mainList.appendChild(d);
  });
  if(!n)mainList.appendChild(E('div','empty','Không có kết quả'));
}
function renderSub(){
  subList.innerHTML='';const s=secs()[activeIndex];
  if(!s){addSubBtn.style.display='none';subList.appendChild(E('div','empty','Chọn một mục'));return}
  addSubBtn.style.display=s.v?'none':'block';
  if(!s.apps.length)subList.appendChild(E('div','empty','Chưa có app nào'));
  s.apps.forEach((a,ai)=>{
    const d=E('div','sub-item');d.appendChild(makeIcon(a,24));
    const t=E('div','sub-t');t.appendChild(E('div','sub-n',a.name));if(a.target)t.appendChild(E('div','sub-g',a.target));d.appendChild(t);
    d.addEventListener('click',()=>{if(launch(a)){dropdown.classList.remove('show');renderSub()}});
    ctxOn(d,(x,y)=>{
      const it=[];
      if(!s.v){
        it.push({label:'Đổi tên',action:()=>uiPrompt('Tên app',a.name,v=>{const pi=pinIdx({name:a.name,target:a.target});if(pi>=0)pinned[pi].name=v;a.name=v;refresh()})});
        it.push({label:'Đổi đường dẫn',action:()=>uiPrompt('Đường dẫn (vd: url:https://..., com.pkg.app)',a.target,v=>{a.target=v;refresh()})});
      }
      it.push({label:'Đổi ảnh',action:()=>pickIcon(a)});
      if(a.icon)it.push({label:'Xóa ảnh riêng',action:()=>{a.icon='';refresh()}});
      it.push({label:pinIdx(a)>=0?'Bỏ ghim khỏi taskbar':'Ghim lên taskbar',action:()=>{const i=pinIdx(a);if(i>=0)pinned.splice(i,1);else pinned.push({name:a.name,target:a.target||''});refresh()}});
      it.push({label:deskIdx(a)>=0?'Bỏ khỏi màn hình chính':'Thêm ra màn hình chính',action:()=>{const i=deskIdx(a);if(i>=0)deskList().splice(i,1);else deskList().push({name:a.name,target:a.target||''});dropdown.classList.remove('show');refresh()}});
      if(!s.v)it.push({label:'Xóa',danger:true,action:()=>{const pi=pinIdx(a);if(pi>=0)pinned.splice(pi,1);for(let k=1;k<=4;k++)desk[k]=desk[k].filter(x=>!same(x,a));s.apps.splice(ai,1);refresh()}});
      showCtx(x,y,it);
    });
    subList.appendChild(d);
  });
}
function renderPinned(){
  const bar=$('pinnedBar');bar.innerHTML='';
  pinned.forEach((p,idx)=>{
    const d=E('div','pinned-item icon-only');d.title=p.name;d.appendChild(makeIcon(findApp(p)||p,tbh-10));
    d.addEventListener('click',e=>{e.stopPropagation();launch(p)});
    ctxOn(d,(x,y)=>showCtx(x,y,[{label:'Bỏ ghim',danger:true,action:()=>{pinned.splice(idx,1);refresh()}}]));
    bar.appendChild(d);
  });
}
function renderDesk(){
  const el=$('desktop');el.innerHTML='';
  const a=wa(),IW=icoSz+36,IH=icoSz+44,rows=Math.max(1,Math.floor((a.b-a.t-8)/IH));
  deskList().forEach((p,idx)=>{
    const x=a.l+8+Math.floor(idx/rows)*IW,y=a.t+8+(idx%rows)*IH;
    const d=E('div','desk-item');d.title=p.name;d.style.cssText='left:'+x+'px;top:'+y+'px;width:'+IW+'px;height:'+IH+'px';
    d.appendChild(makeIcon(findApp(p)||p,icoSz));const nm=E('div','desk-name',p.name);nm.style.maxWidth=(IW-6)+'px';d.appendChild(nm);
    d.addEventListener('click',e=>{e.stopPropagation();launch(p)});
    ctxOn(d,(cx,cy)=>showCtx(cx,cy,[{label:'Đổi ảnh',action:()=>{const f=findApp(p);if(f)pickIcon(f)}},{label:'Xóa khỏi màn hình',danger:true,action:()=>{deskList().splice(idx,1);refresh()}}]));
    el.appendChild(d);
  });
}
function refresh(){renderMain();renderSub();renderPinned();renderDesk();save()}

$('addMainBtn').addEventListener('click',e=>{e.stopPropagation();let n=1;const ex=new Set(sections.map(s=>s.name));while(ex.has('New folder '+n))n++;sections.push({name:'New folder '+n,apps:[]});activeIndex=sections.length-1;refresh()});
addSubBtn.addEventListener('click',e=>{
  e.stopPropagation();const s=sections[activeIndex];if(!s)return;
  uiPrompt('Tên app','App',n=>{uiPrompt('Đường dẫn (vd: url:https://..., com.pkg.app)','',t=>{s.apps.push({name:n,target:t,icon:''});refresh()})});
});
mainList.addEventListener('click',e=>{e.stopPropagation();const it=e.target.closest('.ditem');if(!it)return;activeIndex=Number(it.dataset.i);searchTerm='';searchInput.value='';refresh()});
searchInput.addEventListener('input',e=>{searchTerm=e.target.value.trim().toLowerCase();renderMain()});
searchInput.addEventListener('keydown',e=>e.stopPropagation());
const sq=$('squareIcon');
sq.addEventListener('click',e=>{e.stopPropagation();dropdown.classList.toggle('show');renderSub()});
document.addEventListener('click',e=>{if(!dropdown.contains(e.target)&&!sq.contains(e.target))dropdown.classList.remove('show')});
dropdown.addEventListener('click',e=>e.stopPropagation());
document.addEventListener('keydown',e=>{if(e.key==='Escape'){dropdown.classList.remove('show');closeCtx()}});
[[sq,{type:'test'}],[bottomLogo,{type:'logo'}]].forEach(([el,t])=>ctxOn(el,(x,y)=>showCtx(x,y,[{label:'Đổi ảnh',action:()=>pickIcon(t)},{label:'Khôi phục ảnh gốc',action:()=>resetIcon(t)}])));

const LS_BG_IMG='linuxweb_bg_img',LS_BG_VID='linuxweb_bg_vid';
const wsEls=document.querySelectorAll('.ws'),fileInput=$('fileInput'),videoInput=$('videoInput'),videoBg=$('videoBg');
const bgKeyOf=n=>n===1?LS_BG_IMG:LS_BG_IMG+'_'+n,bgKey=()=>bgKeyOf(ws);
const vidKeyOf=n=>n===1?LS_BG_VID:LS_BG_VID+'_'+n,vidKey=()=>vidKeyOf(ws);
const bgMem={},vidMem={};
const getBg=k=>bgMem[k]||ls.get(k),saveBg=(k,u)=>{bgMem[k]=u;return ls.set(k,u)};
const getVid=k=>vidMem[k]||ls.get(k),saveVid=(k,u)=>{vidMem[k]=u;return ls.set(k,u)};
const curBg=()=>getBg(bgKey())||(ws!==1?getBg(LS_BG_IMG):null);
const curVid=()=>getVid(vidKey())||(ws!==1?getVid(LS_BG_VID):null);
const fitCss=f=>f==='contain'?'contain':(f==='stretch'?'100% 100%':'cover');
function getFit(){const f=ls.get('linuxweb_bg_fit');return(f==='contain'||f==='stretch')?f:'cover'}
function updateWpPreview(){
  const img=curBg(),vid=curVid();
  document.querySelectorAll('#spPreview').forEach(pv=>{
    if(vid){pv.style.backgroundImage='none';pv.textContent='VIDEO'}
    else{pv.textContent=img?'':'Chưa có ảnh';pv.style.backgroundImage=img?"url('"+img+"')":'none';pv.style.backgroundSize=fitCss(getFit())}
  });
  document.querySelectorAll('#spWsLabel').forEach(l=>{l.textContent='Màn hình '+ws});
}
function applyBackground(){
  const img=curBg(),vid=curVid(),s=document.body.style;
  if(vid){
    videoBg.style.display='block';
    if(videoBg.getAttribute('src')!==vid){videoBg.src=vid;const pr=videoBg.play();if(pr&&pr.catch)pr.catch(()=>{})}
    s.backgroundImage='none';
  }else{
    videoBg.style.display='none';try{videoBg.pause()}catch(e){}videoBg.removeAttribute('src');try{videoBg.load()}catch(e){}
    s.backgroundImage=img?"url('"+img+"')":'none';
    s.backgroundSize=fitCss(getFit());s.backgroundPosition='center';s.backgroundRepeat='no-repeat';
  }
  updateWpPreview();
}
function shrinkImage(src,maxEdge,q,cb){
  const img=new Image();
  img.onload=()=>{const s=Math.min(1,maxEdge/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s),cv=E('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);let o=src;try{o=cv.toDataURL('image/jpeg',q)}catch(e){}cb(o)};
  img.onerror=()=>cb(src);img.src=src;
}
const renderWs=()=>wsEls.forEach(el=>el.classList.toggle('active',Number(el.dataset.ws)===ws));
wsEls.forEach(el=>el.addEventListener('click',e=>{
  e.stopPropagation();const nw=Number(el.dataset.ws);if(nw===ws)return;
  const right=nw>ws;ws=nw;ls.set('linuxweb_ws_v1',String(ws));
  renderWs();applyBackground();renderDesk();refreshWindows();renderWinBar();
  const c=$('desktop'),from=right?-view.vw:view.vw;
  c.style.transition='none';c.style.transform='translateX('+from+'px)';c.style.opacity='0';void c.offsetWidth;
  c.style.transition='transform .32s,opacity .32s';c.style.transform='translateX(0)';c.style.opacity='1';
}));
fileInput.addEventListener('change',ev=>{
  const file=ev.target.files&&ev.target.files[0];fileInput.value='';
  if(!file||!file.type.startsWith('image/'))return;
  const key=bgKey(),reader=new FileReader();
  reader.onload=e=>shrinkImage(e.target.result,1920,.85,url=>{saveBg(key,url);applyBackground()});
  reader.readAsDataURL(file);
});
videoInput.addEventListener('change',ev=>{
  const file=ev.target.files&&ev.target.files[0];videoInput.value='';
  if(!file||!file.type.startsWith('video/'))return;
  const reader=new FileReader();
  reader.onload=e=>{saveVid(vidKey(),e.target.result);applyBackground()};
  reader.readAsDataURL(file);
});

const clock=$('clock');
function updateClock(){const n=new Date(),p=v=>String(v).padStart(2,'0');clock.textContent=p(n.getHours())+':'+p(n.getMinutes())+(clockSec?':'+p(n.getSeconds()):'')+'  '+p(n.getDate())+'/'+p(n.getMonth()+1)+'/'+n.getFullYear()}
updateClock();setInterval(updateClock,1000);

function openSettings(){
  const b=E('div');b.style.cssText='display:flex;height:100%;width:100%';
  b.innerHTML='<div class="sp-nav"><div class="sp-nav-item active" data-page="wp">Hình nền</div><div class="sp-nav-item" data-page="ui">Giao diện</div><div class="sp-nav-item" data-page="disp">Màn hình</div></div><div class="sp-content">'+
  '<div class="sp-page active" id="sp-wp"><div class="sp-title">Hình nền</div><div class="sp-preview" id="spPreview"></div>'+
  '<div class="sp-row"><span id="spWsLabel"></span><div class="sp-btns"><button class="sp-btn" id="spPick">Chọn ảnh</button><button class="sp-btn" id="spVideoPick">Chọn video</button><button class="sp-btn danger" id="spClear">Xóa</button></div></div>'+
  '<div class="sp-row"><span>Kiểu hiển thị</span><div class="sp-sel" id="spFit"><div class="sp-sel-cur"></div><div class="sp-sel-list"></div></div></div>'+
  '<div class="sp-row"><span>Dùng cho cả 4 màn hình</span><button class="sp-btn" id="spAll">Áp dụng</button></div></div>'+
  '<div class="sp-page" id="sp-ui"><div class="sp-title">Giao diện</div>'+
  '<div class="sp-row"><span>Logo thanh trên</span><div class="sp-btns"><button class="sp-btn" id="spTestPick">Đổi ảnh</button><button class="sp-btn" id="spTestReset">Khôi phục</button></div></div>'+
  '<div class="sp-row"><span>Logo trong menu</span><div class="sp-btns"><button class="sp-btn" id="spLogoPick">Đổi ảnh</button><button class="sp-btn" id="spLogoReset">Khôi phục</button></div></div>'+
  '<div class="sp-row"><span>Hiện giây trên đồng hồ</span><button class="sp-btn" id="spClockSec"></button></div>'+
  '<div class="sp-row"><span>Vị trí taskbar</span><div class="sp-sel" id="spTbSel"><div class="sp-sel-cur"></div><div class="sp-sel-list"></div></div></div>'+
  '<div class="sp-row"><span>Màu nền Taskbar</span><input type="color" class="sp-color" id="spTbColor"></div>'+
  '<div class="sp-row"><span>Màu chữ Taskbar</span><input type="color" class="sp-color" id="spTbText"></div>'+
  '<div class="sp-row"><span>Độ mờ Taskbar (%)</span><input type="number" class="sp-num" id="spTbA" min="0" max="100" step="5"></div>'+
  '<div class="sp-row"><span>Kích thước biểu tượng (px)</span><input type="number" class="sp-num" id="spIco" min="32" max="96" step="4"></div>'+
  '<div class="sp-row"><span>Độ mờ cửa sổ (%)</span><input type="number" class="sp-num" id="spOpNum" min="0" max="100" step="5"></div></div>'+
  '<div class="sp-page" id="sp-disp"><div class="sp-title">Màn hình</div>'+
  '<div class="sp-row"><span>Độ phân giải</span><div class="sp-sel" id="spRes"><div class="sp-sel-cur"></div><div class="sp-sel-list"></div></div></div>'+
  '<div class="sp-row"><span>Kéo dãn lấp đầy màn hình</span><button class="sp-btn" id="spStretchBtn"></button></div>'+
  '<div class="sp-row"><span>DPI / Tỉ lệ (%)</span><input type="number" class="sp-num" id="spDpiNum" min="70" max="200" step="10"></div>'+
  '<div class="sp-row"><span>Tần số quét (Hz)</span><div class="sp-sel" id="spHz"><div class="sp-sel-cur"></div><div class="sp-sel-list"></div></div></div></div></div>';
  createWindow({title:'Cài đặt',body:b,max:true});
  const q=id=>b.querySelector('#'+id),spClockSec=q('spClockSec'),spStretchBtn=q('spStretchBtn');
  function bindSel(el,labels,get,set){
    const cur=el.querySelector('.sp-sel-cur'),list=el.querySelector('.sp-sel-list');list.innerHTML='';
    const render=()=>{const val=get();cur.textContent=labels[val]||'';list.querySelectorAll('div').forEach(o=>o.classList.toggle('active',o.dataset.v===String(val)))};
    Object.keys(labels).forEach(k=>{const d=E('div','',labels[k]);d.dataset.v=k;d.onclick=e=>{e.stopPropagation();el.classList.remove('open');set(k);render()};list.appendChild(d)});
    cur.onclick=e=>{e.stopPropagation();document.querySelectorAll('.sp-sel.open').forEach(x=>{if(x!==el)x.classList.remove('open')});el.classList.toggle('open')};
    render();
  }
  function bindNum(id,get,min,max,apply){
    const el=q(id);el.value=get();
    el.addEventListener('keydown',e=>e.stopPropagation());
    el.addEventListener('change',()=>{let v=parseInt(el.value,10);if(isNaN(v))v=get();v=Math.max(min,Math.min(max,v));el.value=v;apply(v)});
  }
  b.addEventListener('click',()=>document.querySelectorAll('.sp-sel.open').forEach(x=>x.classList.remove('open')));
  bindSel(q('spFit'),{cover:'Lấp đầy',contain:'Vừa khung',stretch:'Kéo giãn'},getFit,k=>{ls.set('linuxweb_bg_fit',k);applyBackground()});
  bindSel(q('spTbSel'),{top:'Trên',bottom:'Dưới',left:'Trái',right:'Phải'},()=>tb,k=>{tb=k;ls.set('linuxweb_tb',tb);document.body.dataset.tb=tb;renderDesk();refreshWindows()});
  bindSel(q('spRes'),RES_LABEL,()=>res,k=>{res=k;ls.set('linuxweb_res',res);applyDpi();renderDesk();refreshWindows()});
  bindSel(q('spHz'),{0:'Mặc định',60:'60 Hz',90:'90 Hz',120:'120 Hz',144:'144 Hz'},()=>hz,k=>{hz=parseInt(k,10);ls.set('linuxweb_hz',String(hz));applyHz()});
  const renderClockSec=()=>{spClockSec.textContent=clockSec?'Bật':'Tắt'};
  const renderStretch=()=>{spStretchBtn.textContent=isStretch?'Bật':'Tắt';spStretchBtn.classList.toggle('on',isStretch)};
  q('spPick').addEventListener('click',()=>fileInput.click());
  q('spVideoPick').addEventListener('click',()=>videoInput.click());
  q('spClear').addEventListener('click',()=>{const k=bgKey(),v=vidKey();delete bgMem[k];ls.del(k);delete vidMem[v];ls.del(v);applyBackground()});
  q('spAll').addEventListener('click',()=>{
    const img=getBg(bgKey()),vid=getVid(vidKey());
    if(!img&&!vid)return;
    for(let i=1;i<=4;i++){if(img)saveBg(bgKeyOf(i),img);if(vid)saveVid(vidKeyOf(i),vid)}
    applyBackground();
  });
  q('spTestPick').addEventListener('click',()=>pickIcon({type:'test'}));
  q('spTestReset').addEventListener('click',()=>resetIcon({type:'test'}));
  q('spLogoPick').addEventListener('click',()=>pickIcon({type:'logo'}));
  q('spLogoReset').addEventListener('click',()=>resetIcon({type:'logo'}));
  spClockSec.addEventListener('click',()=>{clockSec=!clockSec;ls.set('linuxweb_clock_sec',clockSec?'1':'0');renderClockSec();updateClock()});
  spStretchBtn.addEventListener('click',()=>{isStretch=!isStretch;ls.set('linuxweb_stretch',isStretch?'1':'0');renderStretch();applyDpi();renderDesk();refreshWindows()});
  b.querySelectorAll('.sp-nav-item').forEach(it=>it.addEventListener('click',()=>{
    b.querySelectorAll('.sp-nav-item').forEach(x=>x.classList.toggle('active',x.dataset.page===it.dataset.page));
    b.querySelectorAll('.sp-page').forEach(p=>p.classList.toggle('active',p.id==='sp-'+it.dataset.page));
  }));
  bindNum('spTbA',()=>tbA,0,100,v=>{tbA=v;ls.set('linuxweb_tb_a',String(v));applyTheme()});
  bindNum('spIco',()=>icoSz,32,96,v=>{icoSz=v;ls.set('linuxweb_ico',String(v));renderDesk()});
  bindNum('spOpNum',()=>spA,0,100,v=>{spA=v;ls.set('linuxweb_sp_a',String(v));applyOpacity()});
  bindNum('spDpiNum',()=>dpi,70,200,v=>{dpi=v;ls.set('linuxweb_dpi',String(v));applyDpi();renderDesk();refreshWindows()});
  q('spTbColor').value=tbColor;q('spTbText').value=tbText;
  q('spTbColor').addEventListener('input',e=>{tbColor=e.target.value;ls.set('linuxweb_tb_color',tbColor);applyTheme()});
  q('spTbText').addEventListener('input',e=>{tbText=e.target.value;ls.set('linuxweb_tb_text',tbText);applyTheme()});
  renderClockSec();renderStretch();updateWpPreview();
}
$('settingsBtn').addEventListener('click',e=>{e.stopPropagation();dropdown.classList.remove('show');openSettings()});

window.addEventListener('resize',()=>{applyDpi();renderDesk();refreshWindows();closeCtx()});
window.addEventListener('orientationchange',()=>setTimeout(()=>{applyDpi();renderDesk();refreshWindows()},150));
applyOpacity();renderWs();applyBackground();applyHz();refresh();updateClock();renderWinBar();

}catch(error){
  document.body.innerHTML='<div style="color:#f87171;padding:20px;font-size:16px;white-space:pre-wrap"></div>';
  document.body.firstChild.textContent='Lỗi JavaScript: '+error.message+(error.stack?'\n'+error.stack.split('\n')[1]:'');
}
})();
